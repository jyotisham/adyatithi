पौर्णमास्यां सिनीवाल्यां द्वादश्यां श्रवणेऽथ वा।
दिनक्षये व्यतीपाते संक्रमेऽर्कदिनेऽपि वा॥४-१२-४८॥
श्रावयेच्छ्रद्दधानानां तीर्थपादपदाश्रयः।
नेच्छंस्तत्राऽत्मनाऽऽत्मानं सन्तुष्ट इति सिध्यति॥४-१२-४९॥
---श्रीमद्भागवते महापुराणे
"""
