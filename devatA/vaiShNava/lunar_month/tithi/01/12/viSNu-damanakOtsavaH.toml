id = "viSNu-damanakOtsavaH"
shlokas = """
चैत्रे मासि तथा विष्णोः कार्यो दमनकोत्सवः।
वैष्णवैर्विष्णुभक्त्या च जनतानन्दवर्धनः॥
देवानन्दसमुद्भूता दिव्या दमनमञ्जरी।
निवेद्या विष्णवे भक्त्या सर्वपुण्यफलेप्सुभिः॥

रामार्चनचन्द्रिकायाम्---
द्वादश्यां चैत्रमासस्य शुक्लायां दमनोत्सवः।
बौधायनादिभिः प्रोक्तः कर्तव्यः प्रतिवत्सरम्॥
पारणाहे न लभ्येत द्वादशी घटिकापि चेत्।
तदा त्रयोदशी ग्राह्या पवित्रदमनार्पणे॥

माधवे दमनारोपो मधौ न विहितो यदि।
वैशाख्यां श्रावणे भाद्रे कर्तव्यं वा तदर्पणम्॥

दमनकार्पण-मन्त्रः---
देवदेव जगन्नाथ वाञ्छितार्थप्रदायक।
हृत्स्थान् पूरय मे विष्णो कामान् कामेश्वरीप्रिय॥
इमं दमनकं देव गृहाण मदनुग्रहात्।
इमां सांवत्सरीं पूजां भगवन् परिपूरय॥
---स्मृतिकौस्तुभे
"""
