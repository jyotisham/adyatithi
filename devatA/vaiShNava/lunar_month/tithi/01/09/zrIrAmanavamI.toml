shlokas = """
चैत्रशुक्लनवम्यां तु मध्याह्ने रघुनन्दनः।
दशाननवधाकाङ्क्षी जज्ञे रामः स्वयं हरिः॥
अवतारदिने पुण्ये हरिमुद्दिश्य भक्तितः।
उपवासादि यत् किञ्चित्तदानन्त्याय कल्पते॥
अकरणे दोषमाह स्मृतिः---
यस्तु रामनवम्यां वै मोहाद्भुक्ते नराधमः।
कुम्भीपाकेषु घोरेषु पच्यते नात्र संशयः॥
(कृत्यसारसमुच्चयः)
श्रीब्रह्मवैवर्ते महापुराणे ब्रह्मखण्डे सौतिशौनकसंवादे नारदं प्रति शिवोपदेशे भक्ष्याभक्ष्यादिविवरणं नाम सप्तविंशतितमोऽध्यायः---
जन्माष्टमीदिने रामनवमीदिवसे हरेः।
शिवरात्रौ च यो भुङ्क्ते सोऽपि द्विगुणपातकी॥११॥
ततो यज्ञे समाप्ते तु ऋतूनां षट् समत्ययुः।
ततश्च द्वादशे मासे चैत्रे नावमिके तिथौ॥१-१८-८॥
नक्षत्रेऽदितिदैवत्ये स्वोच्चसंस्थेषु पञ्चसु।
ग्रहेषु कर्कटे लग्ने वाक्पताविन्दुना सह॥१-१८-९॥
प्रोद्यमाने जगन्नाथं सर्वलोकनमस्कृतम्।
कौसल्याजनयद् रामं दिव्यलक्षणसंयुतम्॥१-१८-१०॥
---श्रीमद्वाल्मीकीये रामायणे (गीताप्रेस-संस्करणम्)
+++(Vālmīki: Caitra navamī, Punarvasu (aditi-daivatya), Karkaṭa lagna rising — i.e. around madhyāhna in Caitra)+++

अगस्त्यसंहितायाम्---
चैत्रे नवम्यां प्राक्पक्षे दिवा पुण्ये पुनर्वसौ।
मेषे पूषणि सम्प्राप्ते लग्ने कर्कटकाह्वये।
आविरासीत्स कलया कौसल्यायां परः पुमान्॥
तस्मिन्दिने तु कर्तव्यमुपवासव्रतं सदा।
तत्र जागरणं कुर्याद्रघुनाथपरो भुवि॥

वैष्णवानां विशेषः---
नवमी चाष्टमीविद्धा त्याज्या विष्णुपरायणैः।
उपोषणं नवम्यां च दशम्यां चैव पारणम्॥

अर्घ्य-मन्त्रः---
दशाननवधार्थाय धर्मसंस्थापनाय च।
दानवानां विनाशाय दैत्यानां निधनाय च॥
परित्राणाय साधूनां जातो रामः स्वयं हरिः।
गृहाणार्घ्यं मया दत्तं भ्रातृभिः सहितोऽनघ॥

पारण-मन्त्रः---
तव प्रसादं स्वीकृत्य क्रियते पारणं मया।
व्रतेनानेन सन्तुष्टः स्वामिन् भक्तिं प्रयच्छ मे॥
---स्मृतिकौस्तुभे
