shlokas = """
सत्यं विधातुं निजभृत्यभाषितं
व्याप्तिं च भूतेष्वखिलेषु चात्मनः।
अदृश्यतात्यद्भुतरूपमुद्वहन्
स्तम्भे सभायां न मृगं न मानुषम्॥७-८-१७॥
---श्रीमद्भागवते सप्तमस्कन्धेऽष्टमोऽध्यायः
वैशाखे शुक्लपक्षे तु चतुर्दश्यामिनेऽस्तगे।
उद्बभूवासुरद्वेषी नृसिंहो भक्तवत्सलः॥
अवतारदिने पुण्ये हरिमुद्दिश्य भक्तितः।
उपवासादि यत् किञ्चित्तदानन्त्याय कल्पते॥

वाराहे---
वैशाखस्य सिते पक्षे चतुर्दश्यां महातिथौ।
जयन्ती तत्र कर्तव्या नृसिंहस्य द्विजोत्तमैः॥

नृसिंहपुराणे---
भूतायां शुक्लपक्षे च वैशाखे तु निशामुखे।
वायुभं यदि लभ्येत सोपोष्या सा महाफला॥
(निशामुखं सायंसन्ध्याकालः। वायुभं स्वाती।)

अनङ्गेन समायुक्ता नोपोष्या सा चतुर्दशी।
पूर्णायुक्तां तु तां कुर्यान्नरसिंहस्य तुष्टये॥

सङ्कल्प-मन्त्रः---
उपोष्येऽहं नारसिंह भुक्तिमुक्तिफलप्रद।
शरणं त्वां प्रपन्नोऽस्मि भक्तिं मे नृहरे दिश॥

अर्घ्य-मन्त्रः---
हिरण्याक्षवधार्थाय [?] भूभारोत्तारणाय च।
परित्राणाय साधूनां जातो विष्णुर्नृकेसरी।
गृहाणार्घ्यं मया दत्तं सलक्ष्मीनृहरे स्वयम्॥
---स्मृतिकौस्तुभे
