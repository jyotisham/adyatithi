shlokas = """
षट्षष्टिकोटितीर्थानि द्विसप्तभुवनेषु च।
केशवस्याऽऽज्ञया यान्ति तुलामासे मरुद्वृधम्॥

कावेर्यर्घ्यम्---
मरुद्वृधे महाभागे सर्वलोकैक पावनि।
गृहाणार्घ्यं मया दत्तं पावनं कुरु मां सदा॥
विष्णुमाये महाकाये कवेरकुल सम्भवे।
सह्याचल समुद्भूते गृहाणार्घ्यं वरप्रदे॥
कुम्भसम्भव कुम्भात् त्वं सह्यामलक पूजया।
शङ्खोदकेन संजाता गृहाणार्घ्यं समुद्रगे॥
कावेर्यै नमः इदमर्घ्यम्। कावेर्यै नमः इदमर्घ्यम्। कावेर्यै नमः इदमर्घ्यम्।
+++(Source not traced; current in various sources.)+++
"""
