shlokas = """
चैत्रः श्रीमानयं मासः पुण्यः पुष्पितकाननः।
यौवराज्याय रामस्य सर्वमेवोपकल्प्यताम्॥२-३-४॥
तस्मात् त्वं पुष्ययोगेन यौवराज्यमवाप्नुहि।
कामतस्त्वं प्रकृत्यैव निर्णीतो गुणवानिति॥२-३-४१॥
श्व एव पुष्यो भविता श्वोऽभिषेच्यस्तु मे सुतः।
रामो राजीवपत्राक्षो युवराज इति प्रभुः॥२-४-२॥
उदिते विमले सूर्ये पुष्ये चाभ्यागतेऽहनि।
लग्ने कर्कटके प्राप्ते जन्म रामस्य च स्थिते॥२-१५-३॥
---श्रीमद्वाल्मीकीये रामायणे (गीताप्रेस-संस्करणम्)
"""
