default_to_none = true
jsonClass = "HinduCalendarEventTiming"

[description]
en = "Times declared most auspicious for snāna, japa, homa, vrata, worship of gods and pitṛs, and dāna: ayana, viṣuva, kuhū (amāvāsyā), vyatīpāta, dinakṣaya, solar/lunar eclipses, dvādaśī, Śravaṇa, śukla tṛtīyā, Kārtika (śukla) navamī, the four aṣṭakās, hemanta and śiśira, Māgha śukla saptamī, Maghā with pūrṇimā, pūrṇimā/anumati joined with the month's eponymous nakṣatra, dvādaśī with Anurādhā/Śravaṇa/the three Uttarās, ekādaśī with these, and one's janma-nakṣatra with a saumya yoga. Whatever is done then becomes imperishable."

