shlokas = """
प्रतिस्रोतश्चित्रवाहाः पर्जन्योऽन्नानुसञ्चरन् ।
महाधुरि यथा नावा महापापैः प्रमुच्यते ।
विषुवे विप्रदत्तानि दधिमध्वक्षयाणि च॥३-२०३-१२३॥
अष्टाढकतिलैः कृत्वा तिलधेनुं नराधिप ।
द्वात्रिंशन्निष्कसंयुक्तं विषुवे यः प्रयच्छति ।
मद्भक्त्या मद्गतात्मा वै तस्य पुण्यफलं शृणु॥१४-१०२-६७॥
कन्यादानसहस्रस्य विधिदत्तस्य यत्फलम् ।
तत्पुण्यं समनुप्राप्तो मम लोके महीयते॥१४-१०२-६८॥
मम लोकावतीर्णश्च सोस्मिँल्लोकेऽभिजायते ।
ऋग्यजुस्सामवेदानां पारगो ब्राह्मणर्षभः॥१४-१०२-६९॥
सुवर्णखुरशृङ्गीं च कपिलां यः प्रयच्छति ।
विषुवे चायने चापि सोऽश्वमेधफलं लभेत् ।
तेनाश्वमेधतुल्येन मम लोकं स गच्छति॥१४-१०५-६९॥
उपवासं तु यः कृत्वाऽप्यहोरात्रं जितेन्द्रियः ।
कपिलापञ्चगव्यं तु पीत्वा चान्द्रायणात्परम्॥१४-१०६-२५॥
सौम्ये मुहूर्ते तत्प्रशय शुद्धात्मा शुद्धमानसः ।
क्रोधानृतविनिर्मुक्तो मद्गतेनान्तरात्मना॥१४-१०६-२६॥
कपिलापञ्चगव्येन सुमन्त्रेण पृथक्पथक् ।
यो मत्प्रतिकृतिं वाऽपि शङ्कराकृतिमेव वा ।
स्नापयेद्विषुवे यस्तु सोऽश्वमेधफलं लभेत्॥१४-१०६-२७॥
अन्नं गावस्तिलान्भूमिं कन्यादानं तथैव च ।MM-KK-14-03-115-011c	गृहमायतनं धान्यं वाहनं शयनं तथा॥१४-११५-११॥
यच्चान्यच्च मया प्रोक्तं तत्प्रयच्छ युधिष्ठिर ।
दीयते विषुवेष्वेवं श्रोत्रियेभ्यो विशेषतः॥१४-११५-१२॥
तस्य दानस्य कौन्तेय क्षयं नैवोपपद्यते ।
वर्धतेऽहरहः पुण्यं तद्दानं कोटिसम्मितम्॥१४-११५-१३॥
तदेवाद्यक्षरं ब्रह्म परं ब्रह्मेति कीर्तितम् ।
तस्मिन्मुहूर्ते सर्वे तु चिन्तयन्ति परं पदम्॥१४-११५-७॥
देवाश्च वसवो रुद्राः पितरश्चाश्विनौ तथा ।
साध्याश्च विश्वे गन्धर्वाः सिद्धा ब्रह्मर्षयस्तथा॥१४-११५-८॥
सोमादयो ग्रहाश्चैव सरितः सागरास्तथा ।
मरुतोप्सरसो नागा यक्षराक्षसगुह्यकाः॥१४-११५-९॥
विषुवे स्नपनं यस्तु मम कुर्याद्धरस्य वा ।
अर्चनां च यतान्यायं तस्य पुण्यफलं शृणु॥१४-११५-१४॥
दशजन्मकृतं पापं तस्य सद्यो विनश्यति ।
दशानामश्वमेधानामिष्टानां लभते फलम्॥१४-११५-१५॥
विमानं दिव्यमारूढः कामरूपी यथासुखम् ।
स याति मामकं लोकं रुद्रलोकमथापि वा॥१४-११५-१६॥
युधिष्ठिर उवाच ।
भगवंस्तव गायत्री जप्यते च कथं विभो ।
किं वा तस्य फलं देव ममाचक्ष्व सुरेश्वर॥१४-११५-२७॥
भगवानुवाच ।
द्वादश्यां विषुवे चैव चन्द्रसूर्यग्रहे तथा ।
अयने श्रवणे चैव व्यतीपाते तथैव च॥१४-११५-२८॥
अश्वत्तदर्शने चैव तथा मद्दर्शनेऽपि च ।
जप्या तु मम गायत्री चाथवाऽष्टाक्षरं नृप ।
आर्जितं दुष्कृतं तस्य नाशयेन्नात्र संशयः॥१४-११५-२९॥
