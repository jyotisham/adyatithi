en = "Other time-bound observances in the Mahābhārata that do not fix a single recurring day (pakṣa-wide, janma-nakṣatra, kṣayāha, aṣṭakā in general, lists of preferred elements):\n- Observance: Celebrating the Śakra festival (Indramaha) as Vasu did brings prosperity and victory to king and realm (MBh 1.64.21, 1.64.36, 1.64.37, 1.64.38) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: Most auspicious elements for a wedding (vivāha): uttarāyaṇa, Vaiśākha, śukla pakṣa, Hasta, tṛtīyā, Makara lagna, Bava karaṇa — each named as best of its class, not a single joint date (MBh 1.242.14, 1.242.15, 1.242.16, 1.242.17)\n- Observance: Dāna at a ṛtu (season) yields tenfold merit (MBh 3.203.124, 3.203.126)\n- Observance: Dāna at the ṣaḍaśītimukha saṅkrāntis is imperishable (MBh 3.203.125, 3.203.126)\n- Observance: No svādhyāya on anadhyāya days (MBh 12.110.13)\n- Observance: Śrāddha on every tithi by those desiring progeny (MBh 12.110.20)\n- Observance: Annual Vaiśvānarī iṣṭi at the turn of the year (abda-paryaya) (MBh 12.163.15)\n- Observance: Vānaprastha vow: drink boiled yavāgū once in the śukla pakṣa (some) or the kṛṣṇa pakṣa (others) (MBh 12.250.12, 12.250.13, 12.250.14)\n- Observance: Recite the Suparṇa–Nārāyaṇa narrative at śrāddha (MBh 13.44.4)\n- Observance: Nakṣatra-dāna on abhijit (MBh 13.99.27)\n- Observance: Kāmyāṣṭamī observance after cow-gift: live on cow products (MBh 13.106.49, 13.111.19)\n- Observance: Kṛṣṇa-pakṣa tithis from daśamī (except caturdaśī) are best for śrāddha (MBh 13.134.20)\n- Observance: For śrāddha the later (dark) fortnight and the afternoon are superior (MBh 13.134.21)\n- Observance: Kāmya śrāddha on abhijit (MBh 13.136.1, 13.136.11)\n- Observance: Śrāddha offerings in the dark half of the month (MBh 13.139.19, 13.139.20)\n- Observance: Brahmacarya on one's birth day (janma-nakṣatra) (MBh 13.161.30)\n- Observance: No oil on one's birthday (MBh 13.161.134, 13.161.135, 13.161.136) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: Abstain from all meat in the kaumuda śukla-pakṣa (MBh 13.177.61, 13.177.65, 13.177.66, 13.177.67)\n- Observance: Gift of a kapilā cow on Kaumudī at Jyeṣṭha-Puṣkara (MBh 13.193.18, 13.193.28, 13.193.29, 13.193.30) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: Brāhmaṇa who eats pitṛ-śrāddha food in the dark fortnight is purified after a day and night; meanwhile no sandhyā or japa (MBh 13.199.12, 13.199.13) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: Perform pitṛ-pūjā / aṣṭakā-śrāddha (with water offerings) at the aṣṭakās (MBh 13.221.12, 13.221.13, 13.221.14, 13.242.32)\n- Observance: Abstain from meat on one's janma-nakṣatra (MBh 13.233.14)\n- Observance: Householder observes brahmacarya on days of the janma-nakṣatra (MBh 13.233.49, 13.233.50, 13.233.51)\n- Observance: Dāna in the bright fortnight (MBh 13.234.20, 13.234.21, 13.234.23, 13.234.24)\n- Observance: Śrāddha in the kṛṣṇa pakṣa is preferred to the śukla (MBh 13.238.7)\n- Observance: No śrāddha in the śukla pakṣa (MBh 13.238.9)\n- Observance: No śrāddha on even (yugma) days (MBh 13.238.9)\n- Observance: Rhinoceros meat (or pāyasa with sesame and honey) offered on the pitṛ-kṣaya day gives endless satisfaction (MBh 13.238.21)\n- Observance: Day, śukla pakṣa and uttarāyaṇa are auspicious for those about to die; the opposite is censured (MBh 13.242.31)\n- Observance: Give drinking water during the three months of summer (MBh 14.103.66, 14.103.67, 14.103.68, 14.103.69)\n- Observance: Agnyādhāna for a brāhmaṇa in vasanta (MBh 14.111.48, 14.111.49)\n- Observance: Agnyādhāna for a kṣatriya in grīṣma (MBh 14.111.50)\n- Observance: Agnyādhāna for a vaiśya in śarad (MBh 14.111.51, 14.111.52)"

