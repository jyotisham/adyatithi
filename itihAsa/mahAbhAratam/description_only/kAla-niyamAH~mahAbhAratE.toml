shlokas = """
मार्गशीर्षे महाराज पूर्वपक्षे महामखम् ।
ततःप्रभृति चाद्यापि यष्टेः क्षितिपसत्तमैः ॥'॥१-६४-२१॥
ये पूजयिष्यन्ति च मुदा यथा चेदिपतिर्नृपः ।
कारयिष्यन्ति च मुदा यथा चेदिपतिर्नृपः॥१-६४-३६॥
तेषां श्रीर्विजयश्चैव सराष्ट्राणां भविष्यति ।
तथा स्फीतो जनपदो मुदितश्च भविष्यति॥१-६४-३७॥
अयनं चैव मासश्च ऋतुः पक्षस्तथा तिथिः ।
करणं च मुहूर्तं च लग्नसम्पत्तथैव च॥१-२४२-१४॥
विवाहस्य विशालाक्षि प्रशस्तं चोत्तरायणम् ।
वैशाखश्चैव मासानां पक्षाणां शुक्ल एव च॥१-२४२-१५॥
नक्षत्राणां तथा हस्तस्तृतीया च तिथिष्वपि ।
लग्नो हि मकरः श्रेष्ठः करणानां बवस्तथा॥१-२४२-१६॥
पर्वसु द्विगुणं दानमृतौ दशगुणं भवेत् ।
`अब्दे दशगुणं प्रोक्तमनन्तं विषुवे भवेत्'॥३-२०३-१२४॥
ऋतुषु दशगुणं वदन्ति दत्तं शतगुणमृत्वयनादिषु ध्रुवम् ।
भवति सहस्रगुणं दिनस्य राहोर्विषुवति चाक्षयमश्नुते फलम्॥३-२०३-१२६॥
अयने विषुवे चैव षडशीतिमुखेषु च ।
चन्द्रसूर्योपरागे च दत्तमक्षयमुच्यते॥३-२०३-१२५॥
अनध्यायेषु ये विप्राः स्वाध्यायं नैव कुर्वते ।
तपोनिष्ठाः सुतपसो दुर्गाण्यतितरन्ति ते॥१२-११०-१३॥
ये च श्राद्धानि कुर्वन्ति तिथ्यांतिथ्यां प्रजार्थिनः ।
सुविशुद्धेन मनसा दुर्गाण्यतितरन्ति ते॥१२-११०-२०॥
इष्टिं वैश्वानरीं नित्यं निर्वपेदब्दपर्यये ।
अविकल्पः पुरा धर्मो धर्मवादैस्तु केवलः॥१२-१६३-१५॥
दन्तोलूखलिकाः केचिदश्मकुट्टास्तथा परे ।
शुक्लपक्षे पिबन्त्येके यवागूं क्वथितां सकृत्॥१२-२५०-१२॥
कृष्णपक्षे पिबन्त्यन्ये भुञ्जते वा यथागतम् ।
मूलैरेके फलैरेके पुष्पैरेके दृढव्रताः॥१२-२५०-१३॥
वर्तयन्ति यथान्यायं वैखानसमतं श्रिताः ।
एताश्चान्याश्च विविधा दीक्षास्तेषां मनीषिणाम्॥१२-२५०-१४॥
श्राद्धकाले च विप्राणां य इमां श्रावयेच्छुचिः ।
न तत्र रक्षसां भागो नासुराणां च विद्यते॥१३-४४-४॥
दत्त्वोत्तरास्वषाढासु सर्वकामानवाप्नुयात् ।
दुग्धं त्वभिजिते योगे दत्त्वा मधुघृतप्लुतम् ।
धर्मनित्यो मनीषिभ्यः स्वर्गलोके महीयते॥१३-९९-२७॥
एतद्दानं न्यायलब्धं द्विजेभ्यः पात्रे दत्तं प्रापणीयं परीक्ष्य ।
काम्याष्टम्यां वर्तितव्यं दशाहं रसैर्गवां शकृता प्रस्नवैर्वा॥१३-१०६-४९॥
गा वै दत्त्वा गोव्रती स्यात्त्रिरात्रं निशां चैकां संवसेतेह ताभिः ।
काम्याष्टम्यां वर्तितव्यं त्रिरात्रं रसैर्वा गोः शकृता प्रस्रवैर्वा॥१३-१११-१९॥
कृष्णपक्षे दशम्यादौ वर्जयित्वा चतुर्दशीम् ।
श्राद्धकर्मणि तिथ्यस्तु प्रशस्ता न तथेतराः॥१३-१३४-२०॥
यथा चैवापरः पक्षः पूर्वपक्षाद्विशिष्यते ।
तथा श्राद्धस्य पूर्वाह्णादपराह्णो विशिष्यते॥१३-१३४-२१॥
भीष्म उवाच
यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
श्राद्धं त्वभिजितौ कुर्वन्विद्यां श्रेष्ठामवाप्नुयात् ।
श्रवणेषु ददच्छ्राद्धं प्रेत्य गच्छेत्स तद्गतिम्॥१३-१३६-११॥
सदा नावि जलं तज्ज्ञाः प्रयच्छन्ति समाहिताः ।
मासार्धे कृष्णपक्षस्य कुर्यान्निर्वपणानि वै॥१३-१३९-१९॥
पुष्टिरायुस्तथा वीर्यं श्रीश्चैव पितृभक्तितः॥१३-१३९-२०॥
अमावास्यां पौर्णमास्यां चतुर्दश्यां च जन्मनि ।
अष्टम्यामथ द्वादश्यां ब्रह्मचारी सदा भवेत्॥१३-१६१-३०॥
शिरःस्नातोथ कुर्वीत दैवं पित्र्यमथापि च॥१३-१६१-१३४॥
'तैलं जन्मदिनेऽष्टम्यां चतुर्दश्यां च पर्वसु ।'
नक्षत्रे न च कुर्वीत यस्मिञ्जातो भवेन्नरः ।
न प्रोष्ठपदयोः कार्यं तथाऽऽग्नेये च भारत॥१३-१६१-१३५॥
दारुणेषु च सर्वेषु प्रत्यरिं च विवर्जयेत् ।
ज्योतिषे यानि चोक्तानि तानि सर्वाणि वर्जयेत्॥१३-१६१-१३६॥
कौमुद्यास्तु विशेषेण शुक्लपक्षे नराधिप ।
वर्जयेत्सर्वमांसानि धर्मो ह्यत्र विधीयते॥१३-१७७-६१॥
मांसं तु कौमुदं पक्षं वर्जितं पार्थ राजभिः ।
सर्वभूतात्मभूतस्थैर्विदितार्थपरावरैः॥१३-१७७-६५॥
नाभागेनाम्बरीषेण गयेन च महात्मना ।
आयुषाऽथानरण्येन दिलीपरघुसूनुभिः॥१३-१७७-६६॥
उपानहौ च च्छत्रं च कपिला च यथातथम् ।
पुष्करे कपिला देया ब्राह्मणे वेदपारगे॥१३-१९३-१८॥
कपिलां ये प्रयच्छन्ति ब्राह्मणे वेदपारगे ।
पुष्करे च विशेषेण श्रूयतां तस्य यत्फलम्॥१३-१९३-२८॥
गोशतं सवृषं तेन दत्तं भवति शाश्वतम् ।
पापं कर्म च यत्किञ्चिद्ब्रह्महत्यासमं भवेत् ।
शोधयेत्कपिला ह्येका प्रदत्तं गोशतं यथा॥१३-१९३-२९॥
कृष्णपक्षे तु यः श्राद्धं पितॄणामश्नुते द्विजः ।
अन्नमेतदहोरात्रात्पूतो भवति ब्राह्मणः॥१३-१९९-१२॥
न च सन्ध्यामुपासीत न च जाप्यं प्रवर्तयेत् ।
न सङ्किरेत्तदन्नं च ततः पूयेत ब्राह्मणः॥१३-१९९-१३॥
महेश्वर उवाच ।
ये पुरा मनुजा देवि सर्वप्राणिषु निर्दयाः ।
घ्नन्ति बालांश्च भुञ्जन्ते मृगाणां पक्षिणामपि॥१३-२२१-१२॥
गुरुविद्वेषिणश्चैव परपुत्राभ्यसूयकाः ।
पितृपूजां न कुर्वन्ति यथोक्तां चाष्टकादिभिः॥१३-२२१-१३॥
एवंयुक्तसमाचाराः पुनर्जन्मनि शोभने ।
मानुष्यं वा चिरात्प्राप्य निरपत्या भवन्ति ते ।
पुत्रशोकयुताश्चापि नास्ति तत्र विचारणा॥१३-२२१-१४॥
न शक्नुयादपि तथा कौमुदीमासमेव च ।
जन्मनक्षत्रतिथिषु सदा पर्वसु रात्रिषु ।
वर्जनीयं तथा मांसं परत्र हितमिच्छता॥१३-२३३-१४॥
व्रतवद्धारितं चैव ब्रह्मचर्यमकल्मषम् ।
नित्यं संरक्षितं तस्य नैष्ठिकानां विधियते ।
तदिष्यते गृहस्थानां कालमुद्दिश्य कारणम्॥१३-२३३-४९॥
जन्मनक्षत्रयोगेषु पुण्यवासेषु पर्वसु ।
देवताधर्मकार्येषु ब्रह्मचर्यव्रतं चरेत्॥१३-२३३-५०॥
ब्रह्मचर्यव्रतफलं लभेद्दारव्रती सदा ।
शौचमायुस्तथाऽऽरोग्यं लभ्यते ब्रह्मचारिभिः॥१३-२३३-५१॥
यथा सम्भाषितं पूर्वं दातव्यं तत्तथैव च ।
पुण्यक्षेत्रेषु यद्दत्तं पुण्यकालेषु वा यथा ।
तच्छोभनतरं विद्धि गौरवाद्देशकालयोः॥१३-२३४-२०॥
उमोवाच ।
यश्च पुण्यतमो देशस्तथा कालश्च शंस मे॥१३-२३४-२१॥
शरद्वसन्तकालश्च पुण्यमासस्तथैव च ।
शुक्लपक्षश्च पक्षाणां पौर्णमासी च पर्वसु॥१३-२३४-२३॥
माघप्रोष्ठपदौ मासौ श्राद्धकर्मणि पूजितौ ।
पक्षयोः कृष्णपक्षश्च पूर्वपक्षात्प्रशस्यते॥१३-२३८-७॥
पूर्वाह्णे शुक्लपक्षे च रात्रौ जन्मदिनेषु वा ।
युग्मेष्वहस्सु च श्राद्धं न च कुर्वीत पण्डितः॥१३-२३८-९॥
आनन्त्याय भवेद्दत्तं खङ्गमांसं पितृक्षये ।
पायसं सतिलं क्षौद्रं खङ्गमांसेन सम्मितम्॥१३-२३८-२१॥
दिवा च शुक्लपक्षश्च उत्तरायणमेव च ।
मुमूर्षूणां प्रशस्तानि विपरीतं तु गर्हितम्॥१३-२४२-३१॥
पानीयं यः प्रयच्छेद्वै जीवानां जीवनं परम् ।
ग्रीष्मे च त्रिषु मासेषु तस्य पुण्यफलं शृणु॥१४-१०३-६६॥
कपिलाकोटिदानस्य यत्पुण्यं तु विधीयते ।
तत्पुण्यफलमाप्नोति पानीयं यः प्रयच्छति॥१४-१०३-६७॥
पूर्णचन्द्रप्रकाशेन विमानेन विराजता ।
स गच्छेच्चन्द्रभवनं सेव्यमानोप्सरोगणैः॥१४-१०३-६८॥
वसन्ते ब्राह्मणस्य स्यादाधेयोऽग्निर्नराधिप ।
वसन्तो ब्राह्मणो ज्ञेयो वेदयोनिः स उच्यते॥१४-१११-४८॥
अग्न्याधेयं तु येनाथ वसन्ते क्रियतेऽनघ ।
तस्य श्रीर्बह्मवृद्धिश्च ब्राह्मणस्य विवर्धते॥१४-१११-४९॥
