श्रीः प्रजाःक पशवश्चैव वित्तं तेजो बलं यशः॥१४-१११-५०॥
शरदृतौ तु वैश्यस्य ह्याधानीयो हुताशनः ।
शरद्रात्रं स्वयं वैश्यो वैश्ययोनिः स उच्यते॥१४-१११-५१॥
शरद्याधानमेवं वै क्रियते येन पाण्डव ।
तस्यापि श्रीः प्रजाऽऽयुश्च पशवोऽर्थश्च वर्धते॥१४-१११-५२॥
