shlokas = """
अहोरात्रेण द्वादश्यां श्रावणे मासि श्रीधरम् ।
पञ्चयज्ञानवाप्नोति विमानस्थश्च मोदते॥१३-१७१-११॥
[*युधिष्ठिर उवाच
सर्वेषामुपवासानां यच्छ्रेयः सुमहत्फलम् ।
यच्चाप्यसंशयं लोके तन्मे त्वं वक्तुमर्हसि॥१३-१७१-१॥
भीष्म उवाच
शृणु राजन्यथा गीतं स्वयमेव स्वयम्भुवा ।
यत्कृत्वा निर्वृतो भूयात्पुरुषो नात्र संशयः॥१३-१७१-२॥
द्वादश्यां श्रावणे मासि श्रीधराख्यमुपोष्य माम् ।
पूजयेद्य समाप्नोति पञ्चयज्ञफलं नृप॥१४-११४-२५॥
श्रावणेऽप्येवमेवं मामर्चयेद्भक्तिमान्नरः ।
मम सालोक्यमाप्नोति नात्र कार्या विचारणा॥१४-११४-३०॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
