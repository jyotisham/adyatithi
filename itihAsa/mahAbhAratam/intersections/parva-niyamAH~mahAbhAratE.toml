[description]
en = "Parvan-day observances in the Mahābhārata (parvan = pūrṇimā and amāvāsyā; 13.161.135 and 14.106.108 list the parvans beside aṣṭamī and caturdaśī):\n- Observance: Reading the Anukramaṇī adhyāya in purity on every parvan day removes sins and equals reading the whole Bhārata (MBh 1.1.295, 1.1.296)\n- Observance: Making brāhmaṇas hear the Bhārata on parvan days leads to Brahman (MBh 1.62.39)\n- Observance: Dāna on parvan days yields twofold merit (MBh 3.203.124, 3.203.125, 3.203.126)\n- Observance: Hearing the Dhundhumāra ākhyāna on parvan days: long life, prosperity, freedom from disease (MBh 3.207.42, 3.207.43)\n- Observance: Householder's bhikṣā, bali, śrāddha and sthālīpāka on parvan days (MBh 3.234.35, 3.234.36, 3.234.37)\n- Observance: Hearing the Bhūmiparvan on a parvan day pleases the pitṛs (MBh 6.12.48, 6.12.49, 6.12.50)\n- Observance: Purohita performs mahāśānti and a thousand raudra homas at the pakṣa-sandhis for the king (MBh 12.73.10, 12.73.14) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: On parvan days bathe, anoint and adorn oneself and keep fasting and tapas (MBh 12.235.43)\n- Observance: No sexual emission on parvan days (MBh 12.235.52, 12.235.72)\n- Observance: Darśa and Paurṇamāsa iṣṭis (with agnihotra and cāturmāsyas) as the eternal yajña (MBh 12.275.20)\n- Observance: Do not cut or split trees, herbs or grass on parvan days (MBh 12.288.38, 12.288.40, 12.288.42)\n- Observance: Recite the story of Śakra (Vṛtra's slaying) among brāhmaṇas on every parvan (MBh 12.288.65)\n- Observance: Recite the Suparṇa–Nārāyaṇa narrative on every parvan (MBh 13.44.3)\n- Observance: Approach one's wife only on non-parvan, non-forbidden nights (MBh 13.52.11) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: Abstaining from one's wife's ṛtu on parvan days incurs no sin (MBh 13.59.2, 13.59.4) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: Avoid conjugal union outside ṛtu and on parvan days (MBh 13.78.29) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: Recite the lotus-theft ākhyāna on every parvan (MBh 13.143.52, 13.143.53)\n- Observance: Avoid tooth-sticks on parvan days (MBh 13.161.46)\n- Observance: Brahmacarya on all parvan days (MBh 13.161.94)\n- Observance: No oil on parvan days (MBh 13.161.135) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: Recite the Śāṇḍilī–Sumanā ākhyāna on every parvan (MBh 13.185.25)\n- Observance: Recite the cows' mantra 'bahule samaṅge' in the cowpen on parvans (MBh 13.189.34, 13.189.35, 13.189.36, 13.189.37) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: Keep house undefiled on festivals and parvans (MBh 13.190.6, 13.190.7) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: On parvans and in śrāddha/daiva rites: havis not to be seen by certain women; wear white, recite Bhārata (MBh 13.190.12, 13.190.13, 13.190.14) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: Have the dharma-rahasyas recited to brāhmaṇas on parvans (MBh 13.197.8, 13.197.12, 13.197.13) +++(passage marked additional in the Kumbhakonam text)+++\n- Observance: Abstain from meat on parvan days and nights (MBh 13.233.14)\n- Observance: Householder observes brahmacarya on parvans (and holy fast days, divine rites) (MBh 13.233.49, 13.233.50, 13.233.51)\n- Observance: Hearing the Bhārata on parvan days (MBh 18.5.40)"

