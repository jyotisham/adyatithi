shlokas = """
भ्रूणहत्यादिकं चापि पापं जह्यादसंशयम् ।
य इमं शुचिरध्यायं पठेत्पर्वणि पर्वणि॥१-१-२९५॥
अधीतं भारतं तेन कृत्स्नं स्यादिति मे मतिः ।
यश्चैनं शृणुयान्नित्यमार्षं श्रद्धासमन्वितः॥१-१-२९६॥
य इदं श्रावयेद्विद्वान्ब्राह्मणानिह पर्वसु ।
धूतपाप्मा जितस्वर्गो ब्रह्म गच्छति शाश्वतम्॥१-६२-३९॥
पर्वसु द्विगुणं दानमृतौ दशगुणं भवेत् ।
`अब्दे दशगुणं प्रोक्तमनन्तं विषुवे भवेत्'॥३-२०३-१२४॥
अयने विषुवे चैव षडशीतिमुखेषु च ।
चन्द्रसूर्योपरागे च दत्तमक्षयमुच्यते॥३-२०३-१२५॥
ऋतुषु दशगुणं वदन्ति दत्तं शतगुणमृत्वयनादिषु ध्रुवम् ।
भवति सहस्रगुणं दिनस्य राहोर्विषुवति चाक्षयमश्नुते फलम्॥३-२०३-१२६॥
इदं तु पुण्यमाख्यानं विष्णोः समनुकीर्तनम् ।
शृणुयाद्यः स धर्मात्मा पुत्रवांश्च भवेन्नरः॥३-२०७-४२॥
आयुष्मान्भूतिमांश्चैव श्रुत्वा भवति पर्वसु ।
न च व्याधिभयं किञ्चित्प्राप्नोति विगतज्वरः॥३-२०७-४३॥
ये च धर्माः कुटुम्बेषु श्वश्र्वामे कथिताः पुरा ।
`अनुतिष्ठामि तान्सत्ये नित्यकालमतन्द्रिता'॥३-२३४-३५॥
भिक्षाबलिश्राद्धविधिस्थालीपाकाश्च पर्वसु ।
मान्यानां मानसत्कारा ये चान्ये विदिता मम॥३-२३४-३६॥
तान्सर्वाननुवर्तामि दिवारात्रमतन्द्रिता ।
विनयान्नियमांश्चैव सदा सर्वात्मना श्रिता॥३-२३४-३७॥
तस्मादाश्वस कौरव्य पुत्रं दुर्योधनं प्रति ।
श्रुत्वेदं भरतश्रेष्ठ भूमिपर्व मनोनुगम्॥६-१२-४८॥
श्रीमान्भवति राजन्यः सिद्धार्थः साधुसम्मतः ।
आयुर्बलं च कीर्तिश्च तस्य तेजश्च वर्धते॥६-१२-४९॥
यः शृणोति महीपाल पर्वणीदं यतव्रतः ।
प्रीयन्ते पितरस्तस्य तथैव च पितामहाः॥६-१२-५०॥
पक्षसंधिषु कुर्वीत महाशान्तिं पुरोहितः ।
रौद्रहोमसहस्रं च स्वस्य राज्ञः प्रियं हितम्॥१२-७३-१०॥
रौद्रैर्होमैर्महाशान्त्या घृतकम्बलकर्मणा ।
भृग्वङ्गिरोविधिज्ञो वै पुरोधा निर्णुदे मलात्॥१२-७३-१४॥
नित्यं पर्वसु सुस्नाताः स्वनुलिप्ताः स्वलङ्कृताः ।
उपवासतपःशीलाः प्रतीता ब्रह्मवादिनः॥१२-२३५-४३॥
नैवाकाशे न पशुषु नायोनौ च न पर्वसु ।
इन्द्रियस्य विसर्गं ते रोचयन्ति कदाचन॥१२-२३५-५२॥
यज्ञियाश्च तथा वृक्षास्तेषामासन्दुरात्मनाम् ।
कूपस्नानरता नित्यं पर्वमैथुनगामिनः॥१२-२३५-७२॥
कपिल उवाच
दर्शश्च पूर्णमासश्च अग्निहोत्रं च धीमताम् ।
चातुर्मास्यानि चैवासंस्तेषु यज्ञः सनातनः॥१२-२७५-२०॥
ततो वृक्षौषधितृणं तथैवोक्तं यथातथम् ।
व्यथितं वह्निवद्राजन्ब्रह्माणमिदमब्रवीत्॥१२-२८८-३८॥
वयमग्निं तथा शीतं वर्षं च पवनेरितम् ।
सहामः सततं देव तथा च्छेदनभेदने॥१२-२८८-४०॥
ब्रह्मोवाच
पर्वकाले तु सम्प्राप्ते यो वै छेदनभेदनम् ।
करिष्यति नरो मोहात्तमेषाऽनुगमिष्यति॥१२-२८८-४२॥
ये तु शक्रकथां दिव्यामिमां पर्वसुपर्वसु ।
विप्रमध्ये वदिष्यन्ति न ते प्राप्स्यन्ति किल्बिषम्॥१२-२८८-६५॥
य इमां श्रावयेद्विद्वान्कथां पर्वसु पर्वसु
स लोकान्प्राप्नुयात्पुण्यान्देवर्षिभिरभिष्टुतान्॥१३-४४-३॥
अपर्वस्वनिषिद्धासु रात्रिष्वप्यनृतौ व्रजेत् ।
रात्रौ च नातिनियमो न वै ह्यनियमो भवेत् ॥'॥१३-५२-११॥
नारद उवाच ।
बहुभार्यासु सक्तस्य नारीभोगेषु गेहिनः ।
ऋतौ विमुञ्चमानस्य सांनिध्ये भ्रूणहा स्मृतः॥१३-५९-२॥
व्याधितो बन्धनस्थो वा प्रवासेष्वथ पर्वसु ।
ऋतुकाले तु नारीणां भ्रूणहत्यां प्रमुञ्चति॥१३-५९-४॥
नासु स्नेहो नरैः कार्यस्तथैवेर्ष्या जनेश्वर ।
खेदमास्थाय भुञ्जीत धर्ममास्थाय चैव ह ।
`अनृताविह पर्वादिदोषवर्जं नराधिप ॥'॥१३-७८-२९॥
आख्यानं य इदं युक्तः पठेत्वर्वणिपर्वणि ।
न मूर्खं जनयेत्पुत्रं न भवेच्च निराकृतिः॥१३-१४३-५२॥
न तमापत्स्पृशेत्काचिद्विज्वरो न जरावहः ।
विरजाः श्रेयसा युक्तः प्रेत्य स्वर्गमवाप्नुयात्॥१३-१४३-५३॥
वर्जयेद्दन्तकाष्ठानि वर्जनीयानि नित्यशः ।
भक्षयेच्छास्त्रदृष्टानि पर्वस्वपि विवर्जयेत् ।
उदङ्मुखश्च सततं शौचं कुर्यात्समाहितः॥१३-१६१-४६॥
पर्वकालेषु सर्वेषु ब्रह्मचारी सदा भवेत् ।
समानमेकपात्रे तु भुञ्जेन्नान्नं जनेश्वर॥१३-१६१-९४॥
'तैलं जन्मदिनेऽष्टम्यां चतुर्दश्यां च पर्वसु ।'
नक्षत्रे न च कुर्वीत यस्मिञ्जातो भवेन्नरः ।
न प्रोष्ठपदयोः कार्यं तथाऽऽग्नेये च भारत॥१३-१६१-१३५॥
यश्चेदं पाण्डवाख्यानं पठेत्पर्वणि पर्वणि ।
स देवलोकं सम्प्राप्य नन्दने स सुखी वसेत्॥१३-१८५-२५॥
गाव ऊचुः
बहुले समङ्गे ह्यकुतोभये च क्षेमे च सङ्ख्येव हि भूयसी च ।
यथा पुरा ब्रह्मपुरे सवत्सा शतक्रतोर्वज्रधरस्य यज्ञे॥१३-१८९-३४॥
भूयश्च या विष्णुपदे स्थिताया विभावसोश्चापि पथे स्थिता या ।
देवाश्च सर्वे सह नारदेन प्रकुर्वते सर्वसहेति नाम॥१३-१८९-३५॥
मन्त्रेणैतेनाभिवन्देत यो वै विमुच्यते पापकृतेन कर्मणा ।
लोकानवाप्नोति पुरन्दरस्य गवां फलं चन्द्रमसो द्युतिं च॥१३-१८९-३६॥
श्रीरुवाच
प्रकीर्णं भाजनं यत्र भिन्नभाण्डमथासनम् ।
योषितश्चैव हन्यन्ते कश्मलोपहते गृहे॥१३-१९०-६॥
देवताः पितरश्चैव उत्सवे पर्वणीषु वा ।
निराशाः प्रतिगच्छन्ति कश्मलोपहताद्गृहात्॥१३-१९०-७॥
इदं च परमं गुह्यं सरहस्यं निबोधत ।
श्राद्धकल्पे च दैवे च तैर्थिके पर्वणीषु च॥१३-१९०-१२॥
रजस्वला च या नारी श्वित्रिकाऽपुत्रिका च या ।
एताभिश्चक्षुषा दृष्टं हविर्नाश्नन्ति देवताः ।
पितरश्च न तुष्यन्ति वर्षाण्यपि त्रयोदश॥१३-१९०-१३॥
शुक्लवासाः शुचिर्भूत्वा ब्राह्मणान्स्वस्ति वाचयेत् ।
कीर्तयेद्भारतं चैव तथा स्यादक्षयं हविः॥१३-१९०-१४॥
विष्णुरुवाच
धर्मगुह्यानि सर्वाणि देवतानां महात्मनाम् ।
ऋषीणां चैव गुह्यानि यः पठेदाह्निकं सदा॥१३-१९७-८॥
भुञ्जते पितरो देवा हव्यं कव्यमथाक्षयम् ।
श्रावयंश्चापि विप्रेन्द्रान्पर्वसु प्रयतो नरः॥१३-१९७-१२॥
ऋषीणां देवतानां च पितॄणां चैव नित्यदा ।
भवत्यभिमतः श्रीमान्धर्मेषु प्रयतः सदा॥१३-१९७-१३॥
न शक्नुयादपि तथा कौमुदीमासमेव च ।
जन्मनक्षत्रतिथिषु सदा पर्वसु रात्रिषु ।
वर्जनीयं तथा मांसं परत्र हितमिच्छता॥१३-२३३-१४॥
व्रतवद्धारितं चैव ब्रह्मचर्यमकल्मषम् ।
नित्यं संरक्षितं तस्य नैष्ठिकानां विधियते ।
तदिष्यते गृहस्थानां कालमुद्दिश्य कारणम्॥१३-२३३-४९॥
जन्मनक्षत्रयोगेषु पुण्यवासेषु पर्वसु ।
देवताधर्मकार्येषु ब्रह्मचर्यव्रतं चरेत्॥१३-२३३-५०॥
ब्रह्मचर्यव्रतफलं लभेद्दारव्रती सदा ।
शौचमायुस्तथाऽऽरोग्यं लभ्यते ब्रह्मचारिभिः॥१३-२३३-५१॥
य इदं शृणुयाद्विद्वान्पर्वसु द्विजसत्तमः ।
धूतपाप्मा जितस्वर्गो ब्रह्मभूयाय गच्छति॥१८-५-४०॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
