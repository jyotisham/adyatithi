shlokas = """
ब्राह्मण उवाच
श्रुत्वा पुरोहितेनोक्तं पाञ्चालः प्रीतिमांस्तदा ।
घोषयामास नगरे द्रौपद्यास्तु स्वयंवरम्॥१-१८२-२८॥
पुष्यमासे तु रोहिण्यां शुक्लपक्षे शुभे तिथौ ।
दिवसैः पञ्चसप्तत्या भविष्यति न संशयः॥१-१८२-२९॥
द्रव्यहीनाः कथं मर्त्या दरिद्राः साधुवर्तिनः ।
प्राप्नुवन्तीह यज्ञस्य फलं केन च कर्मणा॥१३-१८९-४०॥
पौषमासस्य शुक्ले वै यदा युज्येत रोहिणी ।
तेन नक्षत्रयोगेन आकाशशयनो भवेत्॥१३-१८९-४४॥
एकवस्त्रः शुचिः स्नातः श्रद्दधानः समाहितः ।
सोमस्य रश्मयः पीत्वा महायज्ञफलं लभेत्॥१३-१८९-४५॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
references_primary = [ "Mahābhārata (Kumbhakonam recension) 1.182.28, 1.182.29, 13.189.40, 13.189.44, 13.189.45",]

