shlokas = """
गाथाश्चाप्यत्र गायन्ति पितृगीता युधिष्ठिर ।
सनत्कुमारो भगवान्पुरा मय्यभ्यभाषत॥१३-१३५-११॥
अपि नः स्वकुले जायाद्यो नो दद्यात्त्रयोदशीम् ।
मघासु सर्पिःसंयुक्तं पायसं दक्षिणायने॥१३-१३५-१२॥
आजेन वाऽपि लौहेन मघास्वेव यतव्रतः ।
हस्तिच्छायासु विधिवत्कर्णव्यजनवीजितम्॥१३-१३५-१३॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
