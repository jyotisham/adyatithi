shlokas = """
ततः कुन्तीसुतो राजा लघुभिर्ब्राह्मणैः सह ।
लोमशेन च सुप्रीतस्त्रिरात्रं काम्यकेऽवसत्॥३-९०-२६॥
ते तथेति प्रतिज्ञाय कृष्णया सह पाण्डवाः ।
कृतस्वस्त्ययनाः सर्वे मुनिभिर्देवमानुषैः॥३-९१-२५॥
लोमशस्योपसङ्गृह्य पादौ द्वैपायनस्य च ।
नारदस्य च राजेन्द्र देवर्षेः पर्वतस्य च॥३-९१-२६॥
धौम्येन सहिता वीरास्तथा तैर्वनवासिभिः ।
मार्गशीर्ष्यामतीतायां पुष्येण प्रययुस्ततः॥३-९१-२७॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
