shlokas = """
दिग्गजा ऊचुः
कार्तिके मासि चाश्लेषा बहुलस्याष्टमी शिवा ।
तेन नक्षत्रयोगेन यो ददाति गुडौदनम् ।
इमं मन्त्रं जपञ्छ्राद्धे यताहारो ह्यकोपनः॥१३-१९५-७॥
बलदेवप्रभृतयो ये नागा बलवत्तराः ।
अनन्ता ह्यक्षया नित्यं भोगिनः सुमहाबलाः॥१३-१९५-८॥
तेषां कुलोद्भवा ये च महाभूता भुजङ्गमाः ।
ते मे बलिं प्रयच्छन्तु बलतेजोभिवृद्धये॥१३-१९५-९॥
एवमुक्त्वा बलिं तत्र वल्मीके तु निवेदयेत्॥१३-१९५-११॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
