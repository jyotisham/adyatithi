shlokas = """
एते दोषा मया प्रोक्तास्त्रिषु यः पादमुत्सृजेत् ।
विश्वामित्र उवाच
श्रूयतां परमं गुह्यं रहस्यं धर्मसंहितम् ।
परमान्नेन यो दद्यात्पितॄणामौपहारिकम्॥१३-१८९-३१॥
गजच्छायायां पूर्वस्यां कुतपे दक्षिणामुखः ।
यदा भाद्रपदे मासि भवते बहुले मघा॥१३-१८९-३२॥
श्रूयतां तस्य दानस्य यादृशो गुणविस्तरः ।
कृतं तेन महच्छ्राद्धं वर्षाणीह त्रयोदश॥१३-१८९-३३॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
