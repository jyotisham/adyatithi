tags = [ "MahaBharata", "Vratam", "Cat4",]
jsonClass = "HinduCalendarEvent"
shlokas = """
पितॄनर्च्य प्रतिपदि प्राप्नुयात्स्वगृहे स्त्रियः ।
अभिरूपप्रजायिन्यो दर्शनीया बहुप्रजाः॥१३-१३४-१०॥
स्त्रियो द्वितीयां जायन्ते तृतीयायां तु वाजिनः ।
चतुर्थ्यां क्षुद्रपशवो भवन्ति बहवो गृहे॥१३-१३४-११॥
पञ्चम्यां बहवः पुत्रा जायन्ते कुर्वतां नृप ।
कुर्वाणास्तु नराः षष्ठ्यां भवन्ति द्युतिभागिनः॥१३-१३४-१२॥
कृषिभागी भवेच्छ्राद्धं कुर्वाणः सप्तमीं नृप ।
अष्टम्यां तु प्रकुर्वाणो वाणिज्ये लाभमाप्नुयात्॥१३-१३४-१३॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
references_primary = [ "Mahābhārata (Kumbhakonam recension) 13.134.10, 13.134.11, 13.134.12, 13.134.13",]

