shlokas = """
इमामनुस्मृतिं दिव्यां वैष्णवीं सुसमाहितः ।
स्वपन्विबुद्धश्च पठेद्यत्र तत्र समभ्यसेत्॥१२-२१०-७१॥
पौर्णमास्याममावास्यां द्वादश्यां च विशेषतः ।
श्रावयेच्छ्रद्दधानांश्च मद्भक्तांश्च विशेषतः॥१२-२१०-७२॥
द्वादश्यां पौर्णमास्यां च मासिमासि घृताक्षतम् ।
ब्राह्मणेभ्यः प्रयच्छेत तस्य पुण्यं निबोधत॥१३-१९२-६॥
सोमश्च वर्धते तेन समुद्रश्च महोदधिः ।
अश्वमेधचतुर्भागं फलं सृजति वासवः॥१३-१९२-७॥
दानेनैतेन तेजस्वी वीर्यवांश्च भवेन्नरः ।
प्रीतश्च भगवान्सोम इष्टान्कामान्प्रयच्छति॥१३-१९२-८॥
यस्तु भक्त्या शुचिर्भूत्वा पञ्चम्यां मे नराधिप ।MM-KK-14-03-114-012c	उपवासव्रतं कुर्यात्त्रिकालं चार्चयंस्तु माम् ।
सर्वक्रतुफलं लब्ध्वा मम लोके महीयते॥१४-११४-१२॥
भगवानुवाच ।
पर्वद्वयं च द्वादश्यां श्रवणं च नराधिप ।
मत्पञ्चमीति विख्यातां मत्प्रिया च विशेषतः॥१४-११४-१४॥
तस्मात्तु ब्राह्मणश्रेष्ठैर्मन्निवेशितबुद्धिभिः ।
उपवासस्तु कर्तव्यो मत्प्रियार्तं विशेषतः॥१४-११४-१५॥
द्वादश्यामेव वा कुर्यादुपवासमशक्नुवन् ।
तेनाहं परमां प्रीति यास्यामि नरपुङ्गव॥१४-११४-१६॥
केवलेनोपवासेन द्वादश्यां पाण्डुनन्दन ।
यत्फलं पूर्वमुद्दिष्टं तस्यार्धं लभते नृप॥१४-११४-२९॥
मासेमासे समभ्यर्च्य क्रमशो मामतन्द्रितः ।
पूर्णे संवत्सरे कुर्यात्पुनः संवत्सरं तु माम्॥१४-११४-३१॥
एवं द्वादशवर्षं यो मद्भक्तो मत्परायणः ।
अविघ्नमर्चयानस्तु मम सायुज्यमाप्नुयात्॥१४-११४-३२॥
अर्चयेत्प्रीतिमान्यो मां द्वादश्यां वेदसंहिताम् ।
स पूर्वोक्तफलं राजँल्लभते नात्र संशयः॥१४-११४-३३॥
गन्धं पुष्पं फलं तोयं पत्रं वा मूलमेव वा ।
द्वादश्यां मम यो दद्यात्तत्समो नास्ति मत्प्रियः॥१४-११४-३४॥
युधिष्ठिर उवाच ।
भगवंस्तव गायत्री जप्यते च कथं विभो ।
किं वा तस्य फलं देव ममाचक्ष्व सुरेश्वर॥१४-११५-२७॥
भगवानुवाच ।
द्वादश्यां विषुवे चैव चन्द्रसूर्यग्रहे तथा ।
अयने श्रवणे चैव व्यतीपाते तथैव च॥१४-११५-२८॥
अश्वत्तदर्शने चैव तथा मद्दर्शनेऽपि च ।
जप्या तु मम गायत्री चाथवाऽष्टाक्षरं नृप ।
आर्जितं दुष्कृतं तस्य नाशयेन्नात्र संशयः॥१४-११५-२९॥
---महाभारते (कुम्भघोण-संस्करणम्)
