default_to_none = true
id = "caturdazI~mahAbhAratE"
tags = [ "MahaBharata", "Vratam", "Cat4",]
jsonClass = "HinduCalendarEvent"
shlokas = """
अवश्यं तु युवानोऽस्य प्रमीयन्ते नरा गृहे ।
युद्धभागी भवेन्मर्त्यः कुर्वञ्श्राद्धं चतुर्दशीम्॥१३-१३४-१८॥
कृष्णपक्षे दशम्यादौ वर्जयित्वा चतुर्दशीम् ।
श्राद्धकर्मणि तिथ्यस्तु प्रशस्ता न तथेतराः॥१३-१३४-२०॥
अमावास्यां पौर्णमास्यां चतुर्दश्यां च जन्मनि ।
अष्टम्यामथ द्वादश्यां ब्रह्मचारी सदा भवेत्॥१३-१६१-३०॥
पर्वद्वये चतुर्दश्यामष्टम्यां सन्ध्ययोर्द्वयोः ।
आर्द्रायां जन्मनक्षत्रे विषुवे श्रवणेऽथवा ।
ये ग्राम्यधर्मविरतास्ते नराः स्वर्गगाप्तिनः॥१४-१०६-१०८॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
references_primary = [ "Mahābhārata (Kumbhakonam recension) 13.134.18, 13.134.20, 13.161.30, 14.106.108",]

