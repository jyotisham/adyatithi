shlokas = """
वैशम्पायन उवाच ।
एवमुक्ता ततः शक्रमाजुहाव यशस्विनी ।
अथाजगाम देवेन्द्रो जनयामास चार्जुनम्॥१-१३२-१६॥
`उत्तराभ्यां तु पूर्वाभ्यां फल्गुनीभ्यां ततो दिवा ।
जातस्तु फाल्गुने मासि तेनासौ फल्गुनःस्मृतः'॥१-१३२-१७॥
यस्मिन्नृक्षे समुत्पन्नः पार्थस्तस्य च धीमतः ।
तस्मिन्नुत्तरफल्गुन्यां प्रवृत्ते स्वस्तिवाचने॥१-१३४-१२॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
