jsonClass = "HinduCalendarEvent"
shlokas = """
पञ्चम्यां वाऽपि षष्ठ्यां च पौर्णमास्यां च भारत ।
उपोष्य एकभक्तेन नियतात्मा जितेन्द्रियः॥१३-१६३-१४॥
क्षमावान्रूपसम्पन्नः सुरभिश्चैव जायते ।
नानपत्यो भवेत्प्राज्ञो दरिद्रो वा कदाचन॥१३-१६३-१५॥
यजिष्णुः पञ्चमीं षष्ठीं कुले भोजयते द्विजान् ।
अष्टमीमथ कौरव्य कृष्णपक्षे चतुर्दशीम् ।
उपोष्य व्याधिरहितो वीर्यवानभिजायते॥१३-१६३-१६॥
दीपप्रतिश्रयं चैव दद्यात्पाद्यासनं तथा ।
पञ्चमेऽहनि षष्ठे वा द्वादशेऽप्यष्टमेऽथवा ।
चतदुर्दशे पञ्चदशे ब्रह्मचारी सदा भवेत्॥१३-२११-४३॥
श्मश्रुकर्म शिरोभ्यङ्गमञ्जनं दन्तधावनम् ।
नैतेष्वहस्सु कुर्वीत तेषु लक्ष्मीः प्रतिष्ठिता॥१३-२११-४४॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
references_primary = [ "Mahābhārata (Kumbhakonam recension) 13.163.14, 13.163.15, 13.163.16, 13.211.43, 13.211.44",]

