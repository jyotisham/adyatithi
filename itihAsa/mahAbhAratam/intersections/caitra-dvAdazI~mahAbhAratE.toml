यत्कृत्वा निर्वृतो भूयात्पुरुषो नात्र संशयः॥१३-१७१-२॥
द्वादश्यां मासि चैत्रे तु मां विष्णुं समुपोष्य यः ।
पूजयंस्तदवाप्नोति पौण्डरीकस्य यत्फलम्॥१४-११४-२१॥
---महाभारते (कुम्भघोण-संस्करणम्)
