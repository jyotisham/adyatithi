न तेषामापदः सन्ति नाधयो व्याधयस्तथा ।
ये तवानन्यमनसा कुर्वन्त्यर्चनवन्दनम्॥३-३-४६॥
सर्वरोगैर्विरहिताः सर्वपापविवर्जिताः ।
त्वद्भावभक्ताः सुखिनो भवन्ति चिरजीविनः॥३-३-४७॥
---महाभारते (कुम्भघोण-संस्करणम्)
