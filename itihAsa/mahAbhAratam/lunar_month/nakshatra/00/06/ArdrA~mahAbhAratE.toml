shlokas = """
आर्द्रायां कृसरं दत्त्वा तिलमिश्रमुपोषितः ।
नरस्तरति दुर्गाणि क्षुरधारांश्च पर्वतान्॥१३-९९-८॥
भीष्म उवाच
यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
अपत्यकामो रोहिण्यां तेजस्कामो मृगोत्तमे ।
क्रूरकर्मा ददच्छ्राद्धमार्द्रायां मानवो भवेत्॥१३-१३६-३॥
स्थानं मे तत्र विहितं वीरस्थानमिति प्रिये ।
कपालशतसम्पूर्णमभिरूपं भयानकम्॥१३-२०७-१५॥
मध्याह्ने सन्ध्ययोस्तत्र नक्षत्रे रुद्रदेवते ।
आयुष्कामैरशुद्धैर्वा न गन्तव्यमिति स्थितिः॥१३-२०७-१६॥
पर्वद्वये चतुर्दश्यामष्टम्यां सन्ध्ययोर्द्वयोः ।
आर्द्रायां जन्मनक्षत्रे विषुवे श्रवणेऽथवा ।
ये ग्राम्यधर्मविरतास्ते नराः स्वर्गगाप्तिनः॥१४-१०६-१०८॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
