हस्ते हस्तिरथं दत्त्वा चतुर्युक्तमुपोषितः ।
प्राप्नोति परमाँल्लोकान्पुण्यकामसमन्वितान्॥१३-९९-१६॥
भीष्म उवाच
यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
फल्गुनीषु ददच्छ्राद्धं सुभगः श्राद्धदो भवेत् ।
अपत्यभागुत्तरासु हस्तेन फलभाग्भवेत्॥१३-१३६-६॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
