shlokas = """
श्रवणे कम्बलं दत्त्वा वस्त्रान्तरितमेव वा ।
श्वेतेन याति यानेन स्वर्गलोकानसंवृतान्॥१३-९९-२८॥
भीष्म उवाच
यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
श्राद्धं त्वभिजितौ कुर्वन्विद्यां श्रेष्ठामवाप्नुयात् ।
श्रवणेषु ददच्छ्राद्धं प्रेत्य गच्छेत्स तद्गतिम्॥१३-१३६-११॥
पर्वद्वये चतुर्दश्यामष्टम्यां सन्ध्ययोर्द्वयोः ।
आर्द्रायां जन्मनक्षत्रे विषुवे श्रवणेऽथवा ।
ये ग्राम्यधर्मविरतास्ते नराः स्वर्गगाप्तिनः॥१४-१०६-१०८॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
references_primary = [ "Mahābhārata (Kumbhakonam recension) 13.99.28, 13.136.1, 13.136.11, 14.106.108",]

