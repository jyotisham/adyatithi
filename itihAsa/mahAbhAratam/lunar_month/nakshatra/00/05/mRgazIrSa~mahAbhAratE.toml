यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
अपत्यकामो रोहिण्यां तेजस्कामो मृगोत्तमे ।
क्रूरकर्मा ददच्छ्राद्धमार्द्रायां मानवो भवेत्॥१३-१३६-३॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
