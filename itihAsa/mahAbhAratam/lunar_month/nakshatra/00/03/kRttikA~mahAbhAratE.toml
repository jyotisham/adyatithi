shlokas = """
उर्वशीं कृत्तिकायोगे गत्वा चैव समाहितः ।
लौहित्ये विधिवत्स्नात्वा पुण्डरीकफलं लभेत्॥१३-६४-४६॥
नारद उवाच ।
कृत्तिकासु महाभागे पायसेन ससर्पिषा ।
सन्तर्प्य ब्राह्मणान्साधूँल्लोकानाप्नोत्यनुत्तमान्॥१३-९९-५॥
भीष्म उवाच
यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
श्राद्धं यः कृत्तिकायोगे कुर्वीत सततं नरः ।
अग्नीनाधाय सापत्यो यजेत विगतज्वरः॥१३-१३६-२॥
शिरःस्नातोथ कुर्वीत दैवं पित्र्यमथापि च॥१३-१६१-१३४॥
'तैलं जन्मदिनेऽष्टम्यां चतुर्दश्यां च पर्वसु ।'
नक्षत्रे न च कुर्वीत यस्मिञ्जातो भवेन्नरः ।
न प्रोष्ठपदयोः कार्यं तथाऽऽग्नेये च भारत॥१३-१६१-१३५॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
