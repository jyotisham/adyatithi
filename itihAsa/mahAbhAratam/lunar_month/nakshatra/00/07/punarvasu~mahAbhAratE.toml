shlokas = """
पूपान्पुनर्वसौ दत्त्वा तथैवान्नानि शोभने ।
यशस्वी रूपसम्पन्नो बह्वन्नो जायते कुले॥१३-९९-९॥
भीष्म उवाच
यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
कृषिभागी भवेन्मर्त्यः कुर्वञ्श्राद्धं पुनर्वसौ ।
पुष्टिकामोऽथ पुष्येण श्राद्धमीहेत मानवः॥१३-१३६-४॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
