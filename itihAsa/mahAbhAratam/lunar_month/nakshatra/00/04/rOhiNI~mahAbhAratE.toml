रोहिण्यां प्रसृतैर्मार्गैर्मांसैरन्नेन सर्पिषा ।
पयोऽन्नपानं दातव्यमनृणार्थं द्विजातये॥१३-९९-६॥
भीष्म उवाच
यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
अपत्यकामो रोहिण्यां तेजस्कामो मृगोत्तमे ।
क्रूरकर्मा ददच्छ्राद्धमार्द्रायां मानवो भवेत्॥१३-१३६-३॥
मस्तकान्निस्सृतैस्तोयैः कपिलाया युधिष्ठिर ।MM-KK-14-03-115-055c	गोमूत्रेणापि यः स्नायाद्रोहिण्यां मम वा दिने ।
विप्रपादच्युतैर्वाऽपि तोयैः पापं प्रणश्यति॥१४-११५-५५॥
---महाभारते (कुम्भघोण-संस्करणम्)
