कालशाकं तु विप्रेभ्यो दत्त्वा मर्त्यः समूलकम् ।
ज्येष्ठायामृद्धिमिष्टां वै गतिमिष्टां स गच्छति॥१३-९९-२३॥
भीष्म उवाच
यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
आधिपत्यं व्रजेन्मर्त्यो ज्येष्ठायामपवर्जयन् ।
नरः कुरुकुलश्रेष्ठ ऋद्धो दमपुरःसरः॥१३-१३६-९॥
---महाभारते (कुम्भघोण-संस्करणम्)
