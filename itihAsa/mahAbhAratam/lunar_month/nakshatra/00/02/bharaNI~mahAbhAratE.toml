shlokas = """
भरणीषु द्विजातिभ्यस्तिलधेनुं प्रदाय वै ।
गाः सुप्रभूताः प्राप्नोति नरः प्रेत्य यशस्तथा॥१३-९९-३५॥
भीष्म उवाच
यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
बहुकुप्यकृतं वित्तं विन्दते रेवतीं श्रितः ।
अश्विनीष्वश्वान्विन्देत भरणीष्वायुरुत्तमम्॥१३-१३६-१४॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
