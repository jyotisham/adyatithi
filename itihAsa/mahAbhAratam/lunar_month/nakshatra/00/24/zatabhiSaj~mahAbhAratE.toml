shlokas = """
गन्धाञ्शतभिषग्योगे दत्त्वा सागरुचन्दनान् ।
प्राप्नोत्यप्सरसां सङ्घान्प्रेत्य गन्धांश्च शाश्वतान्॥१३-९९-३०॥
भीष्म उवाच
यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
राज्यभागी धनिष्ठायां भवेत नियतं नरः ।
नक्षत्रे वारुणे कुर्वन्भिषक्सिद्धिमवाप्नुयात्॥१३-१३६-१२॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
