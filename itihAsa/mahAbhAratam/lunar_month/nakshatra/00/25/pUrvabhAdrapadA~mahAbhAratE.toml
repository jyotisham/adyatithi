तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
पूर्वप्रोष्ठपदाः कुर्वन्बहून्विन्दत्यजाविकान् ।
उत्तरासु प्रकुर्वाणो विन्दते गाः सहस्रशः॥१३-१३६-१३॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
