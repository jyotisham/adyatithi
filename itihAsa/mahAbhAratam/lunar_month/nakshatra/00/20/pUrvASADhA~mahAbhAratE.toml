तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
मूले त्वारोग्यमृच्छेत यशोऽषाढासु चोत्तमम् ।
उत्तरासु त्वषाढासु वीतशोकश्चरेन्महीम्॥१३-१३६-१०॥
---महाभारते (कुम्भघोण-संस्करणम्)
