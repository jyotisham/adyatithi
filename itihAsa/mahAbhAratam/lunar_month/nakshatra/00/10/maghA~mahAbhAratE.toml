shlokas = """
मघासु तिलपूर्णानि वर्धमानानि मानवः ।
प्रदाय पुत्रपशुमानिह प्रेत्य च मोदते॥१३-९९-१२॥
भीष्म उवाच
यमस्तु यानि श्राद्धानि प्रोवाच शशबिन्दवे ।
तानि मे शृणु काम्यानि नक्षत्रेषु पृथक्पृथक्॥१३-१३६-१॥
आश्लेषायां ददच्छ्राद्धं धीरान्पुत्रान्प्रजायते ।
ज्ञातीनां तु भवेच्छ्रेष्ठो मघासु श्राद्धमावपन्॥१३-१३६-५॥
यथा सम्भाषितं पूर्वं दातव्यं तत्तथैव च ।
पुण्यक्षेत्रेषु यद्दत्तं पुण्यकालेषु वा यथा ।
तच्छोभनतरं विद्धि गौरवाद्देशकालयोः॥१३-२३४-२०॥
उमोवाच ।
यश्च पुण्यतमो देशस्तथा कालश्च शंस मे॥१३-२३४-२१॥
शरद्वसन्तकालश्च पुण्यमासस्तथैव च ।
शुक्लपक्षश्च पक्षाणां पौर्णमासी च पर्वसु॥१३-२३४-२३॥
पितृदैवतनक्षत्रनिर्मलो दिवसस्तथा ।
तच्छोभनतरं विद्धि चन्द्रसूर्यग्रहे तथा॥१३-२३४-२४॥
ग्रहोपरागे विषुवेऽयनान्ते पित्र्ये मघासु स्वसुते च जाते ।
गयेषु पिण्डेषु च पाण्डुपुत्र दत्तं भवेन्निष्कसहस्रतुल्यम्॥१४-११०-२७॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
