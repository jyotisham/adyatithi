श्रीभगवानुवाच
धर्म्यमस्मद्धितं चैव कुरूणां यदनामयम् ।
एष यास्यामि राजानं धृतराष्ट्रमभीप्सया॥५-८२-५॥
वैशम्पायन उवाच
ततो व्यपेते तमसि सूर्ये विमल उद्गते ।
मैत्रे मुहूर्ते सम्प्राप्ते मृद्वर्चिषि दिवाकरे॥५-८२-६॥
कौमुदे मासि रेवत्यां शरदन्ते हिमागमे ।
स्फीतसस्यसुखे काले कल्यः सत्ववतां वरः॥५-८२-७॥
---महाभारते (कुम्भघोण-संस्करणम्)
