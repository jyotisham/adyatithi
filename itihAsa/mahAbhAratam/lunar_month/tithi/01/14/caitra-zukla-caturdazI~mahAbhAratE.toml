shlokas = """
अश्वमेधमवाप्नोति कुलं चैव समुद्धरेत् ।
ततो गच्छेत राजेन्द्र सङ्गमं लोकविश्रुतम्॥३-८०-१२५॥
सरस्वत्या महापुण्यं केशवं समुपासते ।
यत्र ब्रह्मादयो देवा ऋषयश्च तपोधनाः॥३-८०-१२६॥
अभिगच्छन्ति राजेन्द्र चैत्रशुक्लचतुर्दशीम् ।
तत्र स्नात्वा नरव्याघ्र विन्देद्बहुसुवर्णकम् ।
सर्वपापविशुद्धात्मा ब्रह्मलोकं च गच्छति॥३-८०-१२७॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
