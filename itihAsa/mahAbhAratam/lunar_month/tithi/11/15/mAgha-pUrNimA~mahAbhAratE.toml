shlokas = """
तस्य नित्यं सदाषाढ्यां माघ्यां च बहवो द्विजाः ।
ईप्सितं भोजनवरं लभन्ते सत्कृतं तथा॥१२-१७०-१७॥
पुरा प्रभासे ऋषयः समग्राः समेता वै मन्त्रममन्त्रयन्त ।
चराम सर्वां पृथिवीं पुण्यतीर्थां तन्नः कामं हन्त गच्छाम सर्वे॥१३-१४३-३॥
जग्मुः पुरस्कृत्य महानुभावं शतक्रतुं वृत्रहणं नरेन्द्राः ।
तीर्थानि सर्वाणि परिभ्रमन्तो माघ्यां ययुः कौशिकीं पुण्यतीर्थाम्॥१३-१४३-६॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
