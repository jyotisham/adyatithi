shlokas = """
माघमासे तिलान्यस्तु ब्राह्मणेभ्यः प्रयच्छति ।
सर्वसत्वसमाकीर्णं नरकं स न पश्यति॥१३-१०१-८॥
पितृभक्तो माघमासं यः क्षिपेदेकभोजनः ।
श्रीमत्कुले ज्ञातिमध्ये सुभगत्वं प्रपद्यते॥१३-१६३-२०॥
माघप्रोष्ठपदौ मासौ श्राद्धकर्मणि पूजितौ ।
पक्षयोः कृष्णपक्षश्च पूर्वपक्षात्प्रशस्यते॥१३-२३८-७॥
माघमासं सदा यस्तु वर्तते चैकभुक्ततः ।
मदर्चनपरो भूत्वा डम्भक्रोधविवर्जितः ।
मामिकामपि सावित्रीं सन्ध्यायां तु जपेद्बुधः॥१४-११३-१८॥
दत्त्वा दु दक्षिणामन्ते भोजयित्वा द्विजानपि ।MM-KK-14-03-113-019c	नमिस्करोति तान्भक्त्या मद्गतेनान्तरात्मना ।
त्रिकालस्नानयुक्तस्य तस्य पुण्यफलं शृणु॥१४-११३-१९॥
नीलकण्ठप्रयुक्तेन यानेनांऽबरशोभिना ।
पितृलोकं व्रजेच्छ्रीमान्सेव्यमानोप्सरोणैः॥१४-११३-२०॥
तत्र प्रकामं क्रीडित्वा भद्राश्वेषूपजायते ।
ततश्च्युतश्चतुर्वेदी विप्रो भवति भूतले॥१४-११३-२१॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
