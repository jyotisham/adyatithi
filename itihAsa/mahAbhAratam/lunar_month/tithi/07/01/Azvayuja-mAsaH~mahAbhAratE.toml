shlokas = """
घृतं मासे आश्वयुजि विप्रभ्यो यः प्रयच्छति ।
तस्मै प्रयच्छतो रूपं प्रीतौ देवाविहाश्विनौ॥१३-१००-१०॥
तथैवाश्वयुजं मासमेकभक्तेन यः क्षिपेत् ।
प्रज्ञावान्वाहनाढ्यश्च बहुपुत्रश्च जायते॥१३-१६३-२८॥
यश्चाप्याश्वयुजं मासमेकभुक्तेन वर्तते ।
मद्गायत्रीं जपेद्भक्त्या मद्गतेनान्तरात्मना ।
द्विसन्ध्यं वा त्रिसन्ध्यं वा शतमष्टोत्तरं तु वा॥१४-११३-५१॥
विप्रमग्रासने कृत्वा संयतेन्द्रियमानसः ।
व्रतान्ते भोजयेद्विप्रांस्तस्य पुण्यफलं शृणु॥१४-११३-५२॥
अश्वमेधस्य यत्पुण्यं विधिवत्पाण्डुनन्दन ।
तत्पुण्यफलमासाद्य मम लोके महीयते॥१४-११३-५३॥
ततश्चापि च्युतः कालाच्छ्वेतद्वीपे प्रजायते ।
तत्र भुक्त्वा च भोगांश्च ततो विप्रवरो भवेत्॥१४-११३-५४॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
