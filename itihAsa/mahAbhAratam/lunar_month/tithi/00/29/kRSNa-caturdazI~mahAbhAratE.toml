jsonClass = "HinduCalendarEvent"
shlokas = """
ततो गच्छेत राजेन्द्र शङ्करं लोकविश्रुतम् ।
कृष्णपक्षे चतुर्दश्यामभिगम्य वृषध्वजम्॥३-८१-७५॥
लभेत सर्वकामान्हि स्वर्गलोकं च गच्छति ।
तिस्रः कोट्यस्तु तीर्थानां शङ्करे कुरुनन्दन॥३-८१-७६॥
यजिष्णुः पञ्चमीं षष्ठीं कुले भोजयते द्विजान् ।
अष्टमीमथ कौरव्य कृष्णपक्षे चतुर्दशीम् ।
उपोष्य व्याधिरहितो वीर्यवानभिजायते॥१३-१६३-१६॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
references_primary = [ "Mahābhārata (Kumbhakonam recension) 3.81.75, 3.81.76, 13.163.16",]

