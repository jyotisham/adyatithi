shlokas = """
[विभावसुरुवाच
सलिलस्याञ्जलिं पूर्णमक्षताश्च धृतोत्तराः ।
सोमस्योत्तिष्ठमानस्य तज्जलं चाक्षतांश्च तान्॥१३-१९०-१॥
स्थितो ह्यभिमुखो मर्त्यः पौर्णमास्यां बलिं हरेत् ।
अग्निकार्यं कृतं तेन हुताश्चास्याग्नयस्त्रयः॥१३-१९०-२॥
प्रगृह्यौदुम्बरं पात्रं पक्वान्नं मधुना सह ।
सोमस्योत्तिष्ठमानस्य पौर्णमास्यां बलिं हरेत्॥१३-१९७-४॥
तस्य धर्मफलं नित्यं श्रद्दधाना निबोधत ।
साध्या रुद्रास्तथाऽऽदित्या विश्वेदेवास्तथाऽश्विनौ ||॥१३-१९७-५॥
मरुतो वसवश्चैव प्रतिगृह्णन्ति तं बलिम् ।
सोमश्च वर्धते तेन समुद्रश्च महोदधिः॥१३-१९७-६॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
