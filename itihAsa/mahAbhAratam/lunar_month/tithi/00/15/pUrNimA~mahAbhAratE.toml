shlokas = """
इमामनुस्मृतिं दिव्यां वैष्णवीं सुसमाहितः ।
स्वपन्विबुद्धश्च पठेद्यत्र तत्र समभ्यसेत्॥१२-२१०-७१॥
पौर्णमास्याममावास्यां द्वादश्यां च विशेषतः ।
श्रावयेच्छ्रद्दधानांश्च मद्भक्तांश्च विशेषतः॥१२-२१०-७२॥
पञ्चम्यां वाऽपि षष्ठ्यां च पौर्णमास्यां च भारत ।
उपोष्य एकभक्तेन नियतात्मा जितेन्द्रियः॥१३-१६३-१४॥
क्षमावान्रूपसम्पन्नः सुरभिश्चैव जायते ।
नानपत्यो भवेत्प्राज्ञो दरिद्रो वा कदाचन॥१३-१६३-१५॥
द्वादश्यां पौर्णमास्यां च मासिमासि घृताक्षतम् ।
ब्राह्मणेभ्यः प्रयच्छेत तस्य पुण्यं निबोधत॥१३-१९२-६॥
सोमश्च वर्धते तेन समुद्रश्च महोदधिः ।
अश्वमेधचतुर्भागं फलं सृजति वासवः॥१३-१९२-७॥
दानेनैतेन तेजस्वी वीर्यवांश्च भवेन्नरः ।
प्रीतश्च भगवान्सोम इष्टान्कामान्प्रयच्छति॥१३-१९२-८॥
जन्मना व्रतभूयिष्ठो गत्वा तीर्थानि काङ्क्षया ।
उपवासत्रयं कुर्यादेकं वा नियमान्वितः॥१३-२३३-६०॥
पुण्यमासेवते काले पौर्णमास्यां यथाविधि ।
बहिरेव शुचिर्भूत्वा तत्तीर्थं मन्मना विशेत्॥१३-२३३-६१॥
त्रिराप्लुत्य जलाभ्याशे दत्त्वा ब्राह्मणदक्षिणाम् ।
अभ्यर्च्य देवायतनं ततः प्रायाद्यथागतम्॥१३-२३३-६२॥
आदिप्रभृतिशुद्धस्य तीर्थस्नानं शुभं भवेत् ।
तपोर्थं पापनाशार्थं शौचार्थं तीर्थगाहनम्॥१३-२३३-६४॥
यथा सम्भाषितं पूर्वं दातव्यं तत्तथैव च ।
पुण्यक्षेत्रेषु यद्दत्तं पुण्यकालेषु वा यथा ।
तच्छोभनतरं विद्धि गौरवाद्देशकालयोः॥१३-२३४-२०॥
उमोवाच ।
यश्च पुण्यतमो देशस्तथा कालश्च शंस मे॥१३-२३४-२१॥
शरद्वसन्तकालश्च पुण्यमासस्तथैव च ।
शुक्लपक्षश्च पक्षाणां पौर्णमासी च पर्वसु॥१३-२३४-२३॥
पितृदैवतनक्षत्रनिर्मलो दिवसस्तथा ।
तच्छोभनतरं विद्धि चन्द्रसूर्यग्रहे तथा॥१३-२३४-२४॥
पर्वद्वये चतुर्दश्यामष्टम्यां सन्ध्ययोर्द्वयोः ।
आर्द्रायां जन्मनक्षत्रे विषुवे श्रवणेऽथवा ।
ये ग्राम्यधर्मविरतास्ते नराः स्वर्गगाप्तिनः॥१४-१०६-१०८॥
यस्तु भक्त्या शुचिर्भूत्वा पञ्चम्यां मे नराधिप ।MM-KK-14-03-114-012c	उपवासव्रतं कुर्यात्त्रिकालं चार्चयंस्तु माम् ।
सर्वक्रतुफलं लब्ध्वा मम लोके महीयते॥१४-११४-१२॥
भगवानुवाच ।
पर्वद्वयं च द्वादश्यां श्रवणं च नराधिप ।
मत्पञ्चमीति विख्यातां मत्प्रिया च विशेषतः॥१४-११४-१४॥
तस्मात्तु ब्राह्मणश्रेष्ठैर्मन्निवेशितबुद्धिभिः ।
उपवासस्तु कर्तव्यो मत्प्रियार्तं विशेषतः॥१४-११४-१५॥
पिबेत्तु पञ्चगव्यं यः पौर्णमास्यामुपोष्य तु ।
तस्य नश्यति यत्पापं तत्पापं पूर्वसञ्चितम्॥१४-११५-६१॥
तथैव ब्रह्मकूर्चं तु समन्त्रं तु पृथक्पृथक् ।
मासिमासि विबेद्यस्तु तस्य पापं प्रणश्यति॥१४-११५-६२॥
पात्रं च ब्रह्मकूर्चं च शृणु तत्र च भारत ।
पालाशं पद्मपत्रं च ताम्रं वाऽथ हिरण्ययम् ।
सादयित्वा तु गृह्णीयात्तत्तु पात्रमुदाहृतम्॥१४-११५-६३॥
गायत्र्या गृह्णते मूत्रं गन्धद्वारेति गोमयम् ।
आप्यायस्वेति च क्षीरं दधिक्राण्वेति वै दधि॥१४-११५-६४॥
---महाभारते (कुम्भघोण-संस्करणम्)
