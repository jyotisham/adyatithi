shlokas = """
ब्राह्मणः क्षत्रियो वाऽपि वैश्यो वा चरितव्रतः ।
यथावत्कर्तुकामो वै तस्यैवं प्रथमा क्रिया॥१४-११२-३॥
शोधयेत्तु शरीरं स्वं पञ्चगव्येन यन्त्रितः ।
सशिरः कृष्णपक्षस्य ततः कुर्वीत वापनम्॥१४-११२-४॥
शुक्लवासाः शुचिर्भूत्वा मौञ्जीं बध्नीत मेखलाम् ।
पालाशदण्डमादाय ब्रह्मचारिव्रते स्थितः॥१४-११२-५॥
कृतोपवासः पूर्वं तु शुक्लप्रतिपदि द्विजः ।MM-KK-14-03-112-006c	नदीसङ्गमतीर्थेषु शुचौ देशे गृहेऽपि वा ।
गोमयेनोपलिप्तेऽथ स्थण्डिलेऽग्निं निधापयन्॥१४-११२-६॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
