भगवानुवाच ।
शृणु राजन्यथापूर्वं तत्सर्वं कथयामि ते ।
परमं कृष्णद्वादश्यामर्चनायां फलं मम॥१४-११४-५०॥
एकादश्यामुपोष्याथ द्वादश्यामर्चयेत्तु माम् ।
विप्रानपि यथालाभं पूजयेद्भक्तिमान्नरः॥१४-११४-५१॥
स गच्छेद्दक्षिणामूर्तिं मां वा नात्र विचारणा ।
चन्द्रसालोक्यमथवा ग्रहनक्षत्रपूजितः॥१४-११४-५२॥
---महाभारते (कुम्भघोण-संस्करणम्)
