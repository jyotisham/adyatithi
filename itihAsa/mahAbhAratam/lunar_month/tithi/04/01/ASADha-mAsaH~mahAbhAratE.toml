shlokas = """
आषाढमेकभक्तेन स्थित्वा मासमतन्द्रितः ।
बहुधान्यो बहुधनो बहुपुत्रश्च जायते॥१३-१६३-२५॥
आषाढमासं यो राजन्नेकभुक्तेन वर्तते ।
ब्रह्मचारी जितक्रोधो मदर्चनपरायणः॥१४-११३-३७॥
विप्रमग्रासने कृत्वा भूमौ भुञ्जञ्जितेन्द्रियः ।
कृत्वा त्रिषवणं स्नानमष्टाक्षरविधानतः॥१४-११३-३८॥
व्रतान्ते भोजयेद्विद्वान्पायसेन युधिष्ठिर ।
गुडोदनेन राजेन्द्र तस्य पुण्यफलं शृणु॥१४-११३-३९॥
कपिलाशतदानस्य यत्पुण्यं पाण्डुनन्दन ।
तत्पुण्यफलमासाद्य देवलोके महीयते॥१४-११३-४०॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
