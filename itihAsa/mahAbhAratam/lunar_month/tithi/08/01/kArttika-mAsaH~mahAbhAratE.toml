shlokas = """
कार्तिकं तु नरो मासं यः कुर्यादेकभोजनम् ।
शूरश्च बहुभार्यश्च कीर्तिमांश्चैव जायते॥१३-१६३-२९॥
न शक्नुयादपि तथा कौमुदीमासमेव च ।
जन्मनक्षत्रतिथिषु सदा पर्वसु रात्रिषु ।
वर्जनीयं तथा मांसं परत्र हितमिच्छता॥१३-२३३-१४॥
कार्तिकाद्यास्तु ये मासा द्वादशैव प्रकीर्तिताः ।
तेष्वेकबुक्तनियमः सर्वेषामुच्यते मया॥१४-११३-४॥
कार्तिके यस्तु वै मासे नन्दायां संयतेन्द्रियः ।
एकभुक्तेन मद्भक्तो मासमेकं तु वर्तते॥१४-११३-५॥
जलं वा न पिबेन्मासे नान्तरं भोजनात्परम् ।
आदित्यरूपं मां नित्यमर्चयन्सुसमाहितः॥१४-११३-६॥
व्रतान्ते भोजयेद्विप्रान्दक्षिणां सम्प्रदाय च ।
क्रोधलोभविनिर्मुक्तस्तस्य पुण्यफलं शृणु॥१४-११३-७॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
references_primary = [ "Mahābhārata (Kumbhakonam recension) 13.163.29, 13.233.14, 14.113.4, 14.113.5, 14.113.6, 14.113.7",]

