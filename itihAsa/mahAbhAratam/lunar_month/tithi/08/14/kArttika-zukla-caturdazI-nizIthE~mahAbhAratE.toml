shlokas = """
तद्वृत्तं तु त्रयोदश्यां समवेतं महात्मनोः ।
चतुर्दश्यां निशायां तु निवृत्तो मागधः क्लमात्॥२-२४-३४॥
तस्मात्तेऽद्यैव कौन्तेय पीडनीयो जनाधिपः ।
सममेतेन युध्यस्व बाहुभ्यां भरतर्षभ॥२-२४-३७॥
प्रभञ्जनबलाविष्टो जरासन्धमरिन्दमः ।
उत्क्षिप्य भ्रामयामास बलवन्तं महाबलः॥२-२५-९॥
भ्रामयित्वा शतगुणं जानुभ्यां भरतर्षभ ।
बभञ्ज पृष्टं सङ्क्षिप्य निष्पिष्य विननाद च॥२-२५-१०॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
references_primary = [ "Mahābhārata (Kumbhakonam recension) 2.24.34, 2.24.37, 2.25.9, 2.25.10",]

