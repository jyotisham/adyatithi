tags = [ "MahaBharata", "PuranaEvents", "Vratam", "Cat2", "Cat4",]
jsonClass = "HinduCalendarEvent"
shlokas = """
मम त्वं निलयं प्राप्तः प्रियातिथिरनिन्दितः ।
पूजितो यास्यसि प्रातर्विधिदृष्टेन कर्मणा॥१२-१६८-२३॥
ततः प्रभातसमये सुखं पृष्ट्वाऽब्रवीदिदम् ।
गच्छ सौम्य पथाऽनेन कृतकृत्यो भविष्यसि॥१२-१६९-१४॥
इतस्त्रियोजनं गत्वा राक्षसाधिपतिर्महान् ।
विरूपाक्ष इति ख्यातः सखा मम महाबलः॥१२-१६९-१५॥
कार्तिक्यामद्य भोक्तारः सहस्रं मे द्विजोत्तमाः ।
तत्रायमपि भोक्ता तु देयमस्मै च मे धनम्॥१२-१७०-९॥
स चाद्य दिवसः पुण्यो ह्यतिथिश्चायमागतः ।
सङ्कल्पितं चैव धनं किं विचार्यमतः परम्॥१२-१७०-१०॥
ततः सहस्रं विप्राणां विदुषां समलङ्कृतम् ।
स्नातानामनुलिप्तानामहतक्षौमवाससाम्॥१२-१७०-११॥
ततो जाम्बूनदीः पात्रीर्वज्राङ्का विमलाः शुभाः ।
वरान्नपूर्णा विप्रेभ्यः प्रादान्मधुघृतप्लुताः॥१२-१७०-१६॥
न्यायतस्तु तिलाञ्शुद्धान्संहृत्याथ स्वशक्तितः ।
तिलराशिं पुनः कुर्यात्पर्वाताभं सुरत्नकम् ।
महान्तं यदि वा स्तोकं नानाद्रव्यसमन्वितम्॥१३-२३६-४॥
सुवर्णरजताभ्यां च मणिमुक्ताप्रवालकैः ।
अलङ्कृत्य यथायोगं सपताकं सवेदिकम् ।
सभूषणं सवस्त्रं च शयनासनसंमितम्॥१३-२३६-५॥
प्रायशः कौमुदीमासे पौर्णमास्यां विशेषतः ।
भोजयित्वा च विधिवद्ब्राह्मणानर्हतो बहून्॥१३-२३६-६॥
स्वयं कृतोपवासश्च वृत्तशौचसमन्वितः ।
दद्यात्प्रदक्षिणीकृत्य तिलराशिं सदक्षिणम्॥१३-२३६-७॥
ब्रह्मदेयाग्रहारांश्च पुत्राणामौर्ध्वदेहिकम् ।
इतो रत्नानि गाश्चैव दासीदासमजाविकम्॥१५-१४-११॥
अर्चयित्वा कुरुश्रेष्ठो ब्राह्मणेभ्यः प्रयच्छतु ।
दीनान्धकृपणेभ्यश्च तत्रतत्र नृपाज्ञया॥१५-१४-१२॥
इत्युक्ते विदुरेणाथ धृतराष्ट्रोऽभिनन्द्य तान् ।
मनश्चक्रे महादाने कार्तिक्यां जनमेजय॥१५-१४-१५॥
ग्रामाग्रहारद्वीपाढ्यो मणिहेमजलार्णवः ।
गान्धार्याश्च महाराज प्रददावौर्ध्वदेहिकम्॥१५-१५-१५॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
