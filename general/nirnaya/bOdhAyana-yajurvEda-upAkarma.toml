[description]
en = "For followers of the bOdhAyana zAkhA of the kRSNa-yajurveda. The chain zrAvaNa-pUrNimA -> ASADha-pUrNimA -> bhAdrapada-pUrNimA (each at madhyAhna, paraviddha; note ASADha comes before bhAdrapada here, unlike the general yajurvEda-upAkarma rule) is checked in order, and the first one with no eclipse (before relative ghaTikA 45), saGkramaNa, or zukra mAudhya/bAlya/vArdhakya flaw is used. If all three are flawed: a mAudhya-only flaw on zrAvaNa-pUrNimA is remediable, so it is used anyway, performed zAntipUrvakam (`bOdhAyana-yajurvEda-upAkarma~zAntipUrvakam`); but an eclipse/saGkramaNa flaw on zrAvaNa-pUrNimA has no such remedy, so ASADha-pUrNimA (the first switch in this chain) is used instead, accepted despite its own flaws. Date is decided by the `upaakarma` nirNaya procedure in jyotisha (`jyotisha/panchaanga/temporal/festival/nirnaya/upaakarma.py`), with the primary day in `[timing]` and the fall-backs in `[timing.nirnaya_options]`."

[names]
sa = [ "बोधायन-यजुर्वेद-उपाकर्म",]
