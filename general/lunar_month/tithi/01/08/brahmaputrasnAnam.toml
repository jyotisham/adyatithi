jsonClass = "HinduCalendarEvent"
shlokas = """
स्कान्दे---
चैत्रे मासि सिताष्टम्यां यो नरो नियतेन्द्रियः।
स्नायाल्लौहित्यतोयेषु स याति ब्रह्मणः पदम्॥
लौहित्यो ब्रह्मपुत्रः। तत्र सङ्कल्पः---
ओमद्येत्यादि सर्वपापक्षयपूर्वकब्रह्मपदगमनकामो ब्रह्मपुत्रस्नानमहं करिष्ये इति।
ॐ ब्रह्मपुत्र महाभाग शन्तनोः कुलसम्भव।
अमोघागर्भसम्भत पापं लौहित्य मे हर॥
इति पठित्वा स्नायात्।

निर्णयसिन्धौ तिथितत्त्वे कालिकापुराणे---
चैत्रं तु सकलं मासं शुचिः प्रयतमानसः।
लौहित्यतोये यः स्नायात्स कैवल्यमवाप्नुयात्॥
+++(Nirnaya Sindhu gives the first verse above also from Kalika Purana, via Tithitattva, not Skanda.)+++
"""

