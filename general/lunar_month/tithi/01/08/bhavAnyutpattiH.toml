निर्णयसिन्धौ---
तत्र नवमीयुता ग्राह्या।
ब्रह्मवैवर्ते---
अष्टमी नवमीयुक्ता नवमी चाष्टमीयुता।

काशीखण्डे---
भवानीं यस्तु पश्येत शुक्लाष्टम्यां मधौ नरः।
न जातु शोकं लभते सदानन्दमयो भवेत्॥

काशीखण्डे---
चैत्राष्टम्यां महायात्रा भवान्याः कारयेत्सुधीः।
अष्टाधिकाः प्रकर्तव्याः शतकृत्वः प्रदक्षिणाः॥
---स्मृतिकौस्तुभे
