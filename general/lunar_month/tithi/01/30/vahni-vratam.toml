tags = [ "SpecialVratam", "LessCommonFestivals",]
shlokas = """
हेमाद्रौ विष्णुधर्मोत्तरे---
कृष्णपक्षे पञ्चदश्यां चैत्रादारभ्य यादव।
वह्निसम्पूजनं कृत्वा गन्धमाल्यान्नसम्पदा॥
तिलहोमं तथा कुर्यान्नाम्ना च नराधिप।
संवत्सरान्ते दद्याच्च सुवर्णं ब्राह्मणाय वै॥
कृत्वा व्रतं वत्सरमेतदिष्टं प्राप्नोति वित्तं सततं यशश्च।
धर्मे रतिं रूपमनुत्तमं च कामान् यथेष्टान् पुरुषप्रधानः॥
---स्मृतिकौस्तुभे
"""
references_primary = [ "Smriti Kaustubham p.108",]
