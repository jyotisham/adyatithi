shlokas = """
उत्थानमन्त्रः---
महेन्द्ररुद्रैरभिनूयमानो भवानृषिर्बन्दितवन्दनीयः।
प्राप्ता तवेयं किल कौमुदाख्या जागृष्व जागृष्व च लोकनाथ॥
मेघा गता निर्म्मलपूर्णचन्द्रः शारद्यपुष्पाणि च लोकानाथ।
अहं ददानीति च पुण्यहेतोर्ज्जागृष्व जागृष्व च लोकानाथ॥
उत्तिष्ठोत्तिष्ठ गोविन्द त्यज निद्रां जगत्पते।
त्वया चोत्थीयमानेन उत्थितं भुवनत्रयम्॥
+++(Quoted in the Śabdakalpadruma from Tithitattva, as printed there; लोकानाथ is unmetrical and should be checked against Tithitattva.)+++

उत्तिष्ठोत्तिष्ठ गोविन्द उत्तिष्ठ गरुडध्वज।
उत्तिष्ठ कमलाकान्त त्रैलोक्यं मङ्गलं कुरु॥
+++(Veṅkaṭeśa-suprabhāta v. 2, used in current practice as a prabodhana prārthanā. No Purāṇa or nibandha prescribing it for this day was found.)+++
"""

