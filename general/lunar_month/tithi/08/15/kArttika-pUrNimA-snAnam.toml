references_secondary = [ "Vrata Nirnaya Kalpavalli",]
jsonClass = "HinduCalendarEvent"
shlokas = """
उदयात् प्राक् चतस्रस्तु नाडिका अरुणोदयः।
तत्र स्नानं प्रशंसन्ति स हि पुण्यतमः स्मृतः॥
बलं रूपं यशो धर्मं ज्ञानमायुः सुखं धृतिम्।
आरोग्यं परमाप्नोति सम्यक् स्नानेन मानवः॥
भविष्ये---
वैशाखी कार्तिकी माघी ह्याषाढ्यप्यतिपुण्यदाः।
स्नानदानविहीना वै तासु रौरवगामिनः॥
कार्तिक्यां तु विशेषेण योऽभिगच्छति पुष्करम् ।
`फलं तत्राक्षयं तेन लभते भरतर्षभ'॥३-८०-३२॥
यस्तु वर्षशतं पूर्णमग्निहोत्रमुपासते ।
कार्तिकीं वा वसेदेकां पुष्करे सममेव तत्॥३-८०-३७॥
सरस्वत्यां महाराज शतं संवत्सरं च ते ।
दृश्यन्ते भरतश्रेष्ठ वृत्तां वै कार्तिकीं सदा॥३-८०-११५॥
---महाभारते (कुम्भघोण-संस्करणम्)
(Mahābhārata: Puṣkara on the Kārttikī; bathing at Śaśayāna on the Sarasvatī when the Kārttikī comes)
"""

