shlokas = """
फाल्गुने पूर्णिमायां तु होलिकापूजनं मतम्॥१२४-७६॥
सञ्चयं सर्वकाष्ठानामुपलानां च कारयेत्।
तत्राग्निं विधिवद्ध्रुत्वा रक्षोघ्नैर्मन्त्रविस्तरैः॥१२४-७७॥
असृक्पाभयसन्त्रस्तैः कृता त्वं होलि बालिशैः।
अतस्त्वां पूजयिष्यामि भूते भूतिप्रदा भव॥१२४-७८॥
इति मन्त्रेण सन्दीप्य काष्ठादिक्षेपणैस्ततः।
परिक्रम्योत्सवः कार्य्यो गीतवादित्रनिःस्वनैः॥१२४-७९॥
होलिका राक्षसी चेयं प्रह्लादभयदायिनी।
ततस्तां प्रदहन्त्येवं काष्ठाद्यैर्गीतमङ्गलैः॥१२४-८०॥
---नारदीये

स्मृतिकौस्तुभे संवत्सरदीधितौ फाल्गुनकृत्ये (होलिकोत्सवः, p.516-518)---
सर्वदुष्टापहो होमः सर्वरोगोपशान्तिदः।
क्रियतेऽस्यां द्विजैः पार्थ तेन सा होलिका स्मृता॥
---भविष्योत्तरे (निर्णयामृते)

अत्र च प्रदोषव्यापिपूर्णमासी भद्रारहिता ग्राह्या।
प्रदोषव्यापिनी ग्राह्या पूर्णिमा फाल्गुनी सदा।
---नारदीये
मुखे पञ्च गले त्वेका वक्षस्येकादश स्मृताः।
नाभौ चतस्रः षट् श्रोणौ तिस्रः पुच्छाख्यनाडिकाः॥
---नारदः +++(bhadrā's parts, in ghaṭikā: mukha 5, kaṇṭha 1, hṛdaya 11, nābhi 4, kaṭi 6, puccha 3)+++
तस्यां भद्रामुखं त्यक्त्वा पूज्या होला निशामुखे।
---नारदीये

पूजामन्त्रः---
अस्माभिर्भयसंत्रस्तैः कृता त्वं होलिके यतः।
अतस्त्वां पूजयिष्यामो भूते भूतिप्रदा भव॥

सार्धयामत्रयं पूर्णा द्वितीये दिवसे यदा।
प्रतिपद्वर्धमाना तु तदा सा होलिका स्मृता॥
---भविष्योत्तरे (निर्णयामृते)
दिनार्धात्परतोऽपि स्यात्फाल्गुनी पूर्णिमा यदि।
रात्रौ भद्रावसाने च होलिकां तत्र दीपयेत्॥
---पुराणसमुच्चये
होलां भद्रावसाने च निशि स्वान्ते प्रदीपयेत्।
---भविष्योत्तरे
पृथिव्यां यानि कार्याणि शुभानि त्वशुभानि च।
तानि सर्वाणि सिध्यन्ति विष्टिपुच्छे न संशयः॥
---लल्लः
पूर्वविद्धा प्रकर्तव्या फाल्गुनी पूर्णिमा सदा।
---शिवरहस्ये
श्रावणी दुर्गनवमी दूर्वा चैव हुताशनी।
पूर्वविद्धा प्रकर्तव्या शिवरात्रिर्बलेर्दिनम्॥
---बृहद्यमः
दिवा भद्रा यदा रात्रौ रात्रिभद्रा यदा दिवा।
सा भद्रा भद्रदा यस्माद्भद्रा कल्याणकारिणी॥
---ज्योतिःशास्त्रे
+++(The Shastrartha Samanvaya Sabha 2024 (#20; references/samanvaya-sabha-2024.md) reduces this to: pūrṇimā in both days' pradoṣa or in neither → the second day; only in the first day's → the first, avoiding the bhadrā-mukha; a moon rising eclipsed with no pūrṇimā in that pradoṣa → the day before. jyotisha's `holikaa` nirṇaya implements it.)+++
