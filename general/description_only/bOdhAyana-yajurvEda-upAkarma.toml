[description]
en = "For followers of the bOdhAyana zAkhA of the kRSNa-yajurveda. Date is computed in code (`UpakarmaFestivalAssigner.assign_bodhaayana_upakarma`, in jyotisha): zrAvaNa-pUrNimA at ghatikA 12 (start of madhyAhna), paraviddha. If that day has an eclipse (before relative ghatikA 45), saGkramaNa (including one falling the next day), or zukra-mAudhya flaw, ASADha-pUrNimA is used instead (unconditionally, without re-checking it for the same flaws) -- unlike the general yajurvEda-upAkarma rule, which switches to bhAdrapada-pUrNimA instead. If even ASADha-pUrNimA can't be found, zrAvaNa-pUrNimA itself is used, performed zAntipUrvakam (`bOdhAyana-yajurvEda-upAkarma~zAntipUrvakam`)."

[names]
sa = [ "बोधायन-यजुर्वेद-उपाकर्म",]
