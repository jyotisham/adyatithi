[description]
en = "For followers of the bOdhAyana zAkhA of the kRSNa-yajurveda. Date is computed in code (`UpakarmaFestivalAssigner.assign_bodhaayana_upakarma`, in jyotisha): zrAvaNa-pUrNimA at ghatikA 12 (start of madhyAhna), paraviddha. If that day has an eclipse (before relative ghatikA 45), saGkramaNa, or guru-mAudhya flaw, ASADha-pUrNimA is tried first (unlike the general yajurvEda-upAkarma rule, which tries bhAdrapada first), then bhAdrapada-pUrNimA; if all three are flawed, zrAvaNa-pUrNimA itself is used, performed zAntipUrvakam (`bOdhAyana-yajurvEda-upAkarma~zAntipUrvakam`)."

[names]
sa = [ "बोधायन-यजुर्वेद-उपाकर्म",]
