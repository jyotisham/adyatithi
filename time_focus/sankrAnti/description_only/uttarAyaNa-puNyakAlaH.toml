shlokas = """
सङ्क्रान्तिस्नानाकरणे प्रत्यवायमाह शातातपः—
सूर्यसङ्क्रमणे पुण्ये न स्नायाद्यदि मानवः।
सप्तजन्मसु रोगी स्याद् दुःखभागी च जायते॥
सङ्क्रान्त्यां यानि दत्तानि हव्यकव्यानि मानवैः।
तानि तस्य ददात्यर्कः सप्तजन्मसु निश्चितम्॥
---वैद्यनाथ-दीक्षितीये स्मृतिमुक्ताफले आह्निक-काण्डः (पूर्वभागः)
अतीतानागते पुण्ये द्वे उदग्दक्षिणायने।
त्रिंशत्कर्कटके नाड्यो मकरे विंशतिः स्मृताः॥
या याः सन्निहिता नाड्यस्तास्ताः पुण्यतमाः स्मृताः॥
---वैद्यनाथ-दीक्षितीये स्मृतिमुक्ताफले आह्निक-काण्डः (पूर्वभागः)
जाबालिः---
सङ्क्रान्तिषु यथा कालस्तदीयेऽप्ययने तथा।
वैशाखमासस्य तु या तृतीयाऽनवद्याऽसौ कार्तिकशुक्लपक्षे ।
नभस्यमासस्य च कृष्णपक्षे त्रयोदशी पञ्चदशी च माघे॥१४-११०-२८॥
उपप्लवे चन्द्रमसो रवेश्च श्राद्धस्य कालो ह्ययनद्वये च ।
पानीयमप्यत्र तिलैर्विमिश्रं दद्यात्पितृभ्यः प्रयतो मनुष्यः ।
श्राद्धं कृतं तेन समासहस्रं रहस्यमेतत्पितरो वदन्ति॥१४-११०-२९॥
अयने विषुवे चैव षडशीतिमुखेषु च ।
चन्द्रसूर्योपरागे च दत्तमक्षयमुच्यते॥३-२०३-१२५॥
ऋतुषु दशगुणं वदन्ति दत्तं शतगुणमृत्वयनादिषु ध्रुवम् ।
भवति सहस्रगुणं दिनस्य राहोर्विषुवति चाक्षयमश्नुते फलम्॥३-२०३-१२६॥
सुवर्णखुरशृङ्गीं च कपिलां यः प्रयच्छति ।
विषुवे चायने चापि सोऽश्वमेधफलं लभेत् ।
तेनाश्वमेधतुल्येन मम लोकं स गच्छति॥१४-१०५-६९॥
ग्रहोपरागे विषुवेऽयनान्ते पित्र्ये मघासु स्वसुते च जाते ।
गयेषु पिण्डेषु च पाण्डुपुत्र दत्तं भवेन्निष्कसहस्रतुल्यम्॥१४-११०-२७॥
भगवानुवाच ।
शृणुष्व राजन्विषुवे सोमार्कग्रहणेषु च ।
व्यतीपातेऽयने चैव दानं स्यादक्षयं फलम्॥१४-११५-३॥
युधिष्ठिर उवाच ।
भगवंस्तव गायत्री जप्यते च कथं विभो ।
किं वा तस्य फलं देव ममाचक्ष्व सुरेश्वर॥१४-११५-२७॥
भगवानुवाच ।
द्वादश्यां विषुवे चैव चन्द्रसूर्यग्रहे तथा ।
अयने श्रवणे चैव व्यतीपाते तथैव च॥१४-११५-२८॥
अश्वत्तदर्शने चैव तथा मद्दर्शनेऽपि च ।
जप्या तु मम गायत्री चाथवाऽष्टाक्षरं नृप ।
आर्जितं दुष्कृतं तस्य नाशयेन्नात्र संशयः॥१४-११५-२९॥
---महाभारते (कुम्भघोण-संस्करणम्)
