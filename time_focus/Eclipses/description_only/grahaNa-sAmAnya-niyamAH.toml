shlokas = """
गतानि तेन लोकेऽस्मिन् येन रामायणं श्रुतम्।
हेमभारं कुरुक्षेत्रे ग्रस्ते भानौ प्रयच्छति॥७-१११-१४॥
---श्रीमद्वाल्मीकीये रामायणे (गीताप्रेस-संस्करणम्)
श्रीशुक उवाच— अथैकदा द्वारवत्यां वसतो रामकृष्णयोः।
सूर्योपरागः सुमहानासीत् कल्पक्षये यथा॥१०-७०-१॥
तं ज्ञात्वा मनुजा राजन् पुरस्तादेव सर्वशः।
स्यमन्तपञ्चकं क्षेत्रं जग्मुः श्रेयोविधित्सया॥१०-७०-२॥
---श्रीमद्भागवते महापुराणे
+++(gift of gold at Kurukṣetra on a solar eclipse; pilgrimage to Syamantapañcaka at a solar eclipse)+++
सन्निहत्यामुपस्पृश्य राहुग्रस्ते दिवाकरे ।
अश्वमेधशतं तेन तत्रेष्टं शाश्वतं भवेत्॥३-८१-१९२॥
उदपानानि वाप्यश्च तीर्थान्यायतनानि च ।
निःसंशयममावास्यां समेष्यन्ति नराधिप॥३-८१-१९४॥
मासिमासि नरव्याघ्र सन्निहत्यां न संशयः ।
तीर्थसन्निहनादेव सन्निहत्येति विश्रुता॥३-८१-१९५॥
तत्र स्नात्वा च पीत्वा च स्वर्गलोके महीयते ।
अमावास्यां तु तत्रैव राहुग्रस्ते दिवाकरे॥३-८१-१९६॥
ग्रहोपरागे विषुवेऽयनान्ते पित्र्ये मघासु स्वसुते च जाते ।
गयेषु पिण्डेषु च पाण्डुपुत्र दत्तं भवेन्निष्कसहस्रतुल्यम्॥१४-११०-२७॥
वैशाखमासस्य तु या तृतीयाऽनवद्याऽसौ कार्तिकशुक्लपक्षे ।
नभस्यमासस्य च कृष्णपक्षे त्रयोदशी पञ्चदशी च माघे॥१४-११०-२८॥
उपप्लवे चन्द्रमसो रवेश्च श्राद्धस्य कालो ह्ययनद्वये च ।
पानीयमप्यत्र तिलैर्विमिश्रं दद्यात्पितृभ्यः प्रयतो मनुष्यः ।
श्राद्धं कृतं तेन समासहस्रं रहस्यमेतत्पितरो वदन्ति॥१४-११०-२९॥
चन्द्रसूर्यग्रहे व्योम्नि मम वा शङ्करस्य वा ।
गायत्रीं मामिकां वाऽपि जपेद्यः शङ्करस्य वा॥१४-११५-१९॥
शङ्खर्तूर्यस्वनैश्चैव कांस्यघण्टास्वनैरपि ।
कारयेत्तु ध्वनिं भक्त्या तस्य पुण्यफलं शृणु॥१४-११५-२०॥
गान्धर्वैर्होमजप्यैश्च जप्तैरुत्कृष्टनामभिः ।
दुर्बलोपि भवेद्राहुः सोमश्च बलवान्भवेत्॥१४-११५-२१॥
दक्षिणावर्तशङ्खाद्वा कपिलाशृङ्गतोपि वा ।
प्राक्स्रोतसं नदीं गत्वा ममायतनसन्निधौ॥१४-११५-५३॥
सलिलेन तु यः स्नायात्सकृदेव रविग्रहे ।
तस्य यत्सञ्चितं पापं तत्क्षणादेव नश्यति॥१४-११५-५४॥
