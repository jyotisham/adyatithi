[description]
en = "`{graha}` enters vArdhakya (old age) on {date}, {days} days before it sets into combustion (mAudhyam). At this moment `{graha}` is at `{nakshatra}`-{pada} `{rashi}` (latitude {latitude} {lat_dir}, moving `{motion_sa}` ({motion_en})), magnitude {magnitude}, elongation {elongation} {elong_dir} of the Sun. A graha in vArdhakya is considered weakened, giving reduced results, though less so than in outright mAudhya."

[names]
sa = [ "ग्रहवार्धक्यप्रारम्भः",]
