default_to_none = true
id = "graha-mauDhya-udayaH"
tags = [ "RareDays", "GrahaMaudhya",]
jsonClass = "HinduCalendarEvent"

[timing]
default_to_none = true
jsonClass = "HinduCalendarEventTiming"

[description]
en = "`{graha}` rises out of combustion (udayaH), heading `{direction_sa}` ({direction_en}), on {date}. At this moment `{graha}` is at `{nakshatra}`-{pada} `{rashi}` (latitude {latitude} {lat_dir}, moving `{motion_sa}` ({motion_en})), magnitude {magnitude}, elongation {elongation} {elong_dir} of the Sun. Emergence from combustion restores a graha's full strength; this is generally considered an auspicious time to begin activities connected with `{graha}`'s significations."

[names]
sa = [ "ग्रहोदयः",]
