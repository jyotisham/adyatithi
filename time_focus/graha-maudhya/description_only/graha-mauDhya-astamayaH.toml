default_to_none = true
id = "graha-mauDhya-astamayaH"
tags = [ "RareDays", "GrahaMaudhya",]
jsonClass = "HinduCalendarEvent"

[timing]
default_to_none = true
jsonClass = "HinduCalendarEventTiming"

[description]
en = "`{graha}` sets into combustion (astamayaH), heading `{direction_sa}` ({direction_en}), on {date}. At this moment `{graha}` is at `{nakshatra}`-{pada} `{rashi}` (latitude {latitude} {lat_dir}, moving `{motion_sa}` ({motion_en})), magnitude {magnitude}, elongation {elongation} {elong_dir} of the Sun. Combustion (mAudhyam) is generally considered to weaken a graha's ability to give full results in its significations; undertakings connected with `{graha}` are traditionally best avoided until it re-emerges."

[names]
sa = [ "ग्रहास्तमयः",]
