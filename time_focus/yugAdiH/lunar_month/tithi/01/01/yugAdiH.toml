shlokas = """
मदनरत्ने ब्रह्मपुराणे---
चैत्रे मासि जगद्ब्रह्मा ससर्ज प्रथमेऽहनि।
शुक्लपक्षे समग्रं तु तदा सूर्योदये सति।
प्रवर्तयामास तथा कालस्य गणनामपि॥

वृद्धवसिष्ठः---
वत्सरादौ वसन्तादौ बलिराज्ये तथैव च।
पूर्वविद्धैव कर्तव्या प्रतिपत्सर्वदा बुधैः॥

वत्सरादौ वसन्तादौ बलिराज्ये तथैव च।
तैलाभ्यङ्गमकुर्वाणो नरकं प्रतिपद्यते॥

हेमाद्रौ ब्राह्मे---
तत्र कार्या महाशान्तिः सर्वकल्मषनाशिनी।
सोत्पातप्रशमनी कलिदुःस्वप्ननाशिनी॥
तस्यामादौ तु सम्पूज्यो ब्रह्मा कमलसम्भवः।
पाद्यार्घ्यपुष्पदीपैश्च वस्त्रालङ्कारभोजनैः॥
...
शालाशोभा ततः कार्या मङ्गलालपनं तथा।
भोजयित्वा द्विजान् सर्वान् सुहृत्सम्बन्धिबान्धवान्॥
विशेषेण च भोक्तव्यं कार्यश्चापि महोत्सवः।
एवं संवत्सरारम्भः सर्वसिद्धिप्रवर्तकः॥
---स्मृतिकौस्तुभे
"""
references_primary = [ "Smriti Kaustubham p.85-86",]
