tags = [ "SpecialSnanam", "LessCommonFestivals",]
shlokas = """
माधवे मेषगे भानौ मुरारे मधुसूदन।
प्रातः स्नानेन मे नाथ फलदो भव पापहन्॥

पाद्मे पातालखण्डे---
मधुमासस्य शुक्लायामेकादश्यामुपोषितः।
पंचदश्यां च वा वीर मेषसंक्रमणेऽपि वा॥६॥
वैशाखस्नाननियमं ब्राह्मणानामनुज्ञया।
मधुसूदनमभ्यर्च्य कुर्यात्सुस्नानपूर्वकम्॥७॥
वैशाखं सकलं मासं मेषसंक्रमणे रवेः।
प्रातः सनियमः स्नास्ये प्रीयतां मधुसूदनः॥८॥
मधुहंतुः प्रसादेन ब्राह्मणानामनुग्रहात्।
निर्विघ्नमस्तु मे पुण्यंवैशाखस्नानमन्वहम्॥९॥
माधवे मेषगे भानौ मुरारे मधुसूदन।
प्रातःस्नानेन मे नाथ यथोक्तफलदो भव॥१०॥
यथा ते माधवो मासो वल्लभो मधुसूदन।
प्रातःस्नानेन मे तस्मिन्फलदः पापहा भव॥११॥
---पद्मपुराणे पातालखण्डे ९५

स्कान्दे वैशाखमासमाहात्म्ये---
प्रार्थनामन्त्रः---
मधुसूदन देवेश वैशाखे मेषगे रवौ।
प्रातः स्नानं करिष्यामि निर्विघ्नं कुरु माधव॥३३॥
अर्घ्यमन्त्राः---
वैशाखे मेषगे भानौ प्रातःस्नानपरायणः।
अर्घ्यं तेऽहं प्रदास्यामि गृहाण मधुसूदन॥३४॥
गङ्गाद्याः सरितः सर्वास्तीर्थानि च ह्रदाश्च ये।
प्रगृह्णीत मया दत्तमर्घ्यं सम्यक्प्रसीदथ॥३५॥
ऋषभः पापिनां शास्ता त्वं यमः समदर्शनः।
गृहाणार्घ्यं मया दत्तं यथोक्तफलदो भव॥३६॥
इति चार्घ्यं समर्प्याथ पश्चात्स्नानं समाचरेत्।
---स्कन्दपुराणे वैष्णवखण्डे वैशाखमासमाहात्म्ये ४
"""
