en = "Date is computed in code (`UpakarmaFestivalAssigner.assign_yajurveda_upakarma`, in jyotisha) rather than by this file: zrAvaNa-pUrNimA at ghatikA 12 (start of madhyAhna), paraviddha. If that day has an eclipse (before relative ghatikA 45), saGkramaNa, or guru-mAudhya flaw, bhAdrapada-pUrNimA is tried next, then ASADha-pUrNimA; if all three are flawed, zrAvaNa-pUrNimA itself is used, performed zAntipUrvakam (`yajurvEda-upAkarma~zAntipUrvakam`)."
