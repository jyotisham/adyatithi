[description]
en = "For general/non-bOdhAyana (kRSNa) Yajurveda zAkhA-s (eg. Apastamba, taittirIya). Date is computed in code (`UpakarmaFestivalAssigner.assign_yajurveda_upakarma`, in jyotisha) rather than by this file: the chain zrAvaNa-pUrNimA -> bhAdrapada-pUrNimA -> ASADha-pUrNimA (each at ghatikA 12, start of madhyAhna, paraviddha) is checked in order, and the first one with no eclipse (before relative ghatikA 45), saGkramaNa, or zukra-mAudhya flaw is used. If all three are flawed: a mAudhya-only flaw on zrAvaNa-pUrNimA is remediable, so it is used anyway, performed zAntipUrvakam (`yajurvEda-upAkarma~zAntipUrvakam`); but an eclipse/saGkramaNa flaw on zrAvaNa-pUrNimA has no such remedy, so bhAdrapada-pUrNimA (the first switch in the chain) is used instead, accepted despite its own flaws. See also `zukla-yajurvEda-upAkarma` (zukla Yajurveda; switches to zukla-paJcamI instead) and `bOdhAyana-yajurvEda-upAkarma` (bOdhAyana zAkhA; chain is zrAvaNa -> ASADha -> bhAdrapada instead)."
sa = """

## आपस्तम्बसूत्रेषु
(आर्तव)श्रवणा(पूर्व)पक्ष ओषधीषु जातासु हस्तेन पौर्णमास्यां वा ऽध्यायोपाकर्म।  
अग्नेर् उपसमाधानाद्य्-आज्यभागान्ते ऽन्वारब्धेषु +++(शिष्येषु)+++ काण्ड-ऋषिभ्यो जुहोति,  
सदसस्पतये, सावित्र्या, ऋग्वेदाय यजुर्वेदाय सामवेदायाथर्वणवेदायेति हुत्वा उपहोमो,  
वेदाहुतीनाम् उपरिष्टात् ण्सदसस्पतिम् इत्येके ३
परिषेचनान्तं कृत्वा  

त्रीन् अनुवाकान् आदितो ऽधीयीरन् ४  
प्रथमोत्तमाव् अनुवाकौ वा ५  
त्र्यहम् एकाहं वा क्षम्याधीयीरन् ६  
यथोपाकरणमध्यायः +++(नाम त्रीनध्यायान् अधीयीरन्, प्रथमोत्तमौ वा)+++७


## प्रक्रिया 
