[description]
en = "For zukla Yajurveda zAkhA-s (eg. mAdhyandina, kANva). Date is computed in code (`UpakarmaFestivalAssigner.assign_shukla_yajurveda_upakarma`, in jyotisha) rather than by this file: zrAvaNa-pUrNimA at ghatikA 12 (start of madhyAhna), paraviddha -- same primary as the (kRSNa) yajurvEda-upAkarma rule. If that day has an eclipse (before relative ghatikA 45), saGkramaNa (including one falling the next day), or zukra-mAudhya flaw, zukla-paJcamI of zrAvaNa is used instead (unconditionally, without re-checking it for the same flaws) -- like RgvEda-upAkarma's switch, rather than a pUrNimA of a different masa as in the (kRSNa) yajurvEda-upAkarma / bOdhAyana-yajurvEda-upAkarma rules."

[names]
sa = [ "शुक्ल-यजुर्वेद-उपाकर्म",]
