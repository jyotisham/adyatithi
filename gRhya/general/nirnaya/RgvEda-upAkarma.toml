[description]
en = "The first zravaNa-nakSatra of zrAvaNa-mAsa (at the maitra muhUrta, paraviddha); if that day has an eclipse (before relative ghaTikA 45), a saGkramaNa, or a guru mAudhya/bAlya/vArdhakya flaw, the chain continues with bhAdrapada zukla-paJcamI, then ASADha zukla-paJcamI (each at madhyAhna, paraviddha), and the first unflawed day is used. If all three are flawed: a primary day with only a mAudhya-type flaw is used anyway, performed zAntipUrvakam (`RgvEda-upAkarma~zAntipUrvakam`); otherwise the first fall-back found is used despite its flaws. Date is decided by the `upaakarma` nirNaya procedure in jyotisha (`jyotisha/panchaanga/temporal/festival/nirnaya/upaakarma.py`), with the primary day in `[timing]` and the fall-backs in `[timing.nirnaya_options]`."

[names]
sa = [ "ऋग्वेद-उपाकर्म",]
